function viewPlan(D, m) {
  var g = m.gate;
  var ja = g.kriterien.filter(function (k) { return /^ja/i.test(k.status); }).length;
  var h = '';

  h += '<section class="hero">' +
    '<div class="lead">Entscheidungs-Gate, Stichtag 28. Dezember</div>' +
    '<div class="big num">' + ja + '<u>von ' + g.kriterien.length + '</u></div>' +
    '<div class="pills">' +
    '<span class="pill2">' + D.daysToGate + ' Tage</span>' +
    '<span class="pill2 q">Übertrag bis 31.12. möglich</span>' +
    '</div>' +
    '<div class="acts" style="grid-template-columns:repeat(2,minmax(0,1fr))">' +
    '<button class="act" type="button" data-info="gate">' + IC.gate + '<span>Kriterien</span></button>' +
    '<button class="act" type="button" data-info="evidenz">' + IC.book + '<span>Alle Belege</span></button>' +
    '</div></section>';

  h += sec('Stand heute', 'Mehr', 'data-info="gate"');
  h += tapCard(g.kriterien.map(function (k, i) {
    var p = D.gateProgress[i];
    var pct = p ? clamp(p.now / p.target * 100, 0, 100) : 0;
    return '<div style="margin-bottom:' + (i === g.kriterien.length - 1 ? '0' : '14px') + '">' +
      '<div class="pscale"><span>' + esc(k.kriterium) + '</span><b>' + (k.status ? esc(k.status) : nf0(pct) + ' %') + '</b></div>' +
      pbar(pct, pct >= 100 ? 'good' : '') +
      '<div class="note dim" style="margin-top:5px">' + esc(p ? p.text : k.messung) + '</div></div>';
  }).join(''), 'data-info="gate"');

  var topics = [
    ['sehnen', 'Der Morgenwert', 'Wie bewertet wird und warum morgens', IC.pulse],
    ['stoppregeln', 'Stopp-Regeln', 'Was bei welchem Wert passiert', IC.warn],
    ['spike', 'Die 10-Prozent-Regel', 'Warum der einzelne Lauf entscheidet', IC.spike],
    ['sehnenblock', 'Der Sehnen-Block', 'Drei Phasen, dreimal pro Woche', IC.kraft],
    ['kraftlogik', 'Warum Kraft der Kern ist', 'Kapazität kommt nicht vom Laufen', IC.kraft],
    ['zonen', 'Zone 3 und höher', 'Die Disziplinkontrolle des Plans', IC.run],
    ['temphm', 'Temperatur und Höhenmeter', 'Wann die Pace noch taugt', IC.spike],
    ['mhb', 'Meter pro Herzschlag', 'Die vergleichbare Zahl', IC.pulse],
    ['longrun', 'Der Long Run', 'Die wichtigste Einheit der Woche', IC.run],
    ['strides', 'Strides', 'Sechs mal 15 Sekunden, richtig gemacht', IC.run],
    ['race', 'Vienna Night Run', '17. September, Startblock B', IC.flag],
    ['fueling', 'Ernährung und Fueling', 'Tagesziele, Gels, Renntag', IC.scale],
    ['gewicht', 'Gewicht', 'Nur der Wochenschnitt zählt', IC.scale],
    ['wochenstruktur', 'Die Woche', 'Fünf Slots und die Rangfolge', IC.week],
    ['roadmap', 'Bis zum Renntag', 'Vier Blöcke, ein Gate', IC.gate],
    ['evidenz', 'Wo die Evidenz schwach ist', 'Alle 29 Belege und die Grenzen', IC.book],
    ['legende', 'Abkürzungen', 'RIR, RPE, HSR und die sechs Regeln', IC.book],
  ];
  h += sec('Der Plan im Wortlaut');
  h += card('<div class="list">' + topics.map(function (t) {
    return lrow({ avatar: t[3], title: t[1], sub: t[2], attrs: 'data-info="' + t[0] + '"' });
  }).join('') + '</div>');

  /* Verbindung */
  if (!NET) {
    h += sec('Vorschau');
    h += card('<p class="note">Diese Ansicht läuft in claude.ai und zeigt den Stand vom ' + esc(stamp(Store.meta.modifiedTime) || 'Build') + '. ' +
      'Eintragen und Live-Daten laufen in der App auf dem iPhone, die über dein eigenes Apps Script mit der Tabelle spricht.</p>' +
      (APP_URL ? '<a class="btn wide" style="margin-top:14px" href="' + esc(APP_URL) + '" target="_blank" rel="noopener">' + IC.link + 'App öffnen</a>' : ''));
    return h;
  }
  h += sec('Verbindung', Store.history.length ? 'Verlauf' : '', 'data-act="history"');
  h += card('<div class="dl">' +
    '<div><dt>Quelle</dt><dd>' + (Store.source === 'script' ? 'Google Tabelle, live' : Store.source === 'cache' ? 'Zwischenspeicher' : 'Eingebauter Stand') + '</dd></div>' +
    '<div><dt>Stand</dt><dd>' + esc(stamp(Store.meta && (Store.meta.modifiedTime || Store.meta.fetchedAt)) || '–') + '</dd></div>' +
    (Store.queue.length ? '<div><dt>Wartet auf Versand</dt><dd>' + Store.queue.length + '</dd></div>' : '') +
    '</div>' +
    '<button class="btn wide" style="margin-top:14px" type="button" data-act="setup">' + IC.gear + (Store.canWrite() ? 'Einstellungen' : 'Jetzt verbinden') + '</button>' +
    (Store.meta && Store.meta.sheetUrl ? '<a class="note dim" style="display:inline-flex;gap:6px;align-items:center;margin-top:14px" href="' + esc(Store.meta.sheetUrl) + '" target="_blank" rel="noopener">' + IC.link + 'Tabelle in Google Sheets öffnen</a>' : ''));
  return h;
}

function renderSources(nrs, m, full) {
  if (!nrs || !nrs.length) return '';
  var list = m.quellen.sources.filter(function (s) { return nrs.indexOf(s.nr) >= 0; });
  if (!list.length) return '';
  return '<div class="block"><div class="eyebrow">' + (full ? 'Alle Belege aus dem Plan' : 'Belege') + '</div>' +
    list.map(function (s) {
      var g = String(s.belastbarkeit || '').toLowerCase();
      var cls = g.indexOf('hoch') === 0 ? 'hoch' : (g.indexOf('niedrig') === 0 ? 'niedrig' : '');
      return '<div class="src"><div class="top"><span class="th">' + esc(s.thema) + '</span><span class="grade ' + cls + '">' + esc(s.belastbarkeit) + '</span></div>' +
        '<div class="folgt">' + esc(s.folgt) + '</div>' +
        '<div class="cite">' + esc(s.quelle) + ' (' + esc(s.jahr) + ')</div>' +
        (s.link ? '<a class="cite" style="display:inline-flex;gap:5px;align-items:center;color:var(--wine-hi)" href="' + esc(s.link) + '" target="_blank" rel="noopener">' + IC.link + 'Quelle öffnen</a>' : '') +
        '</div>';
    }).join('') + '</div>';
}

function openInfo(key) {
  if (!INFO || !INFO[key]) {
    Store.ensureContent().then(function () {
      if (INFO[key]) openInfo(key);
      else Toast.show({ title: 'Text nicht gefunden', text: 'Für diesen Punkt liegt kein Eintrag vor.', tone: 'err' });
    }, function (err) {
      Toast.show({ title: 'Erklärtexte fehlen noch', text: (err && err.message) || '', tone: 'err' });
    });
    return;
  }
  var info = INFO[key];
  var D = App.D, m = Store.model, html = '';
  info.blocks.forEach(function (b) {
    if (b.t === 'prose') html += '<p class="prose">' + escRich(b.text) + '</p>';
    else if (b.t === 'quote') html += '<div class="quote' + (b.tone === 'warn' ? ' warnbox' : '') + '">' + escRich(b.text) + '</div>';
    else if (b.t === 'eyebrow') html += '<div class="eyebrow" style="margin-top:4px">' + esc(b.text) + '</div>';
    else if (b.t === 'bullets') html += '<ul class="bul' + (b.num ? ' num' : '') + '">' + b.items.map(function (x) { return '<li>' + escRich(x) + '</li>'; }).join('') + '</ul>';
    else if (b.t === 'rules') html += '<div class="dl stack">' + b.items.map(function (r) {
      return '<div><dt>' + esc(r.k) + '</dt><dd>' + esc(r.v) + '</dd></div>';
    }).join('') + '</div>';
    else if (b.t === 'live') html += '<div data-live="' + esc(b.kind) + '"></div>';
  });
  html += renderSources(info.sources, m);

  Sheet.show({
    title: info.title, sub: info.sub, html: html,
    onMount: function (body) {
      $$('[data-live]', body).forEach(function (host) {
        var fn = LIVE[host.getAttribute('data-live')];
        if (fn) { try { fn(host, D, m); } catch (e) { console.error(e); host.innerHTML = '<p class="note dim">Dieser Baustein konnte nicht geladen werden.</p>'; } }
      });
    },
  });
}

function formDaily(dateISO) {

  var k = sessionKind(day.plan);
  var scale = '';
  for (var i = 0; i <= 10; i++) {
    scale += '<button type="button" data-scale="' + i + '" aria-pressed="' + (day.sehnen === i) + '"' +
      (day.sehnen === i ? ' style="background:' + sevColor(i) + '"' : '') + '>' + i + '</button>';
  }
  var isSes = isSession(day.plan);
  var html =
    '<div class="quote"><b>' + esc(k.label) + '</b><div style="margin-top:3px">' + esc(day.plan) + '</div></div>' +
    '<div class="field"><label>Sehnen früh, der schlechtere von Knie und Achilles</label>' +
    '<div class="scale" id="fScale">' + scale + '</div>' +
    '<div class="scale-legend"><span>0 nichts</span><span>5 abbrechen</span><span>10 maximal</span></div>' +
    '<div class="hint">Morgens, erste 10 bis 20 Schritte, vor Kaffee. Der Wert bewertet den Vortag.</div></div>' +
    '<div class="field"><label>Gewicht früh, kg</label>' +
    '<div class="stepper"><span class="pm"><button type="button" data-step="-0.1">−</button><button type="button" data-step="0.1">+</button></span>' +
    '<input class="input" id="fWeight" type="text" inputmode="decimal" placeholder="74,5" value="' + (day.gewicht != null ? String(day.gewicht).replace('.', ',') : '') + '"></div></div>' +
    (isSes ? '<div class="swrow" style="border-top:1px solid var(--edge-soft);border-bottom:1px solid var(--edge-soft)">' +
      '<div class="l"><b>Einheit erledigt</b><span>' + esc(k.label) + '</span></div>' +

          state.sehnen = (state.sehnen === v) ? null : v;
          $$('#fScale button', body).forEach(function (o) {
            var ov = parseInt(o.getAttribute('data-scale'), 10), on = state.sehnen === ov;
            o.setAttribute('aria-pressed', String(on));
            o.style.background = on ? sevColor(ov) : '';
          });
        });
      });
      $$('[data-step]', body).forEach(function (b) {
        b.addEventListener('click', function () {
          var inp = $('#fWeight', body);
          var cur = parseNum(inp.value);
          if (cur == null) {
            var lastW = Store.model.days.filter(function (d) { return d.gewicht != null; }).slice(-1)[0];
            cur = lastW ? lastW.gewicht : 74.5;
          }
          inp.value = String(Math.round((cur + parseFloat(b.getAttribute('data-step'))) * 100) / 100).replace('.', ',');
        });
      });
      var sw = $('#fDone', body), hint = $('#fDoneHint', body);
      function paintDone() {
        if (!sw) return;
        sw.setAttribute('aria-checked', state.done === true ? 'true' : state.done === false ? 'false' : 'mixed');
        hint.textContent = state.done === true ? 'Erledigt.' : state.done === false ? 'Ausgefallen. Steht so in der Tabelle.' : 'Noch offen. Antippen setzt erledigt, nochmal setzt ausgefallen.';
      }
      if (sw) {
        paintDone();
        sw.addEventListener('click', function () {
          state.done = state.done === true ? false : state.done === false ? null : true;
          paintDone();
        });
      }
      $('#fSave').addEventListener('click', function () {
        if (!requireConnection()) return;
        var payload = { date: dateISO, sehnen: state.sehnen, gewicht: parseNum($('#fWeight', body).value), notiz: $('#fNote', body).value.trim() };
        if (isSes) payload.done = state.done;
        submit('daily', payload, 'Tag ' + dShort(dateISO), $('#fSave'));

    },
  });
}

    '<div class="field"><label>Höhenmeter</label><input class="input" id="rHm" type="text" inputmode="numeric" placeholder="40" value="' + (run.hm != null ? run.hm : '') + '"></div>' +
    '</div>' +
    (/LONG RUN/i.test(run.typ) ? '<div class="field"><label>Entkopplung, nur Long Run ab etwa 60 Minuten</label><input class="input" id="rEnt" type="text" placeholder="z. B. 3 %" value="' + esc(run.entkopplung) + '"></div>' : '') +
    '<div class="field"><label>Untergrund oder Notiz</label><textarea class="input" id="rNote" placeholder="flache Runde, Asphalt">' + esc(run.notiz) + '</textarea></div>' +
    '<button class="btn quiet wide" type="button" data-info="zonen">' + IC.book + 'Was Zone 3 und Pace hier bedeuten</button>';

  Sheet.show({
    title: dLong(dateISO), sub: run.typ, html: html,
    footer: '<button class="btn quiet" type="button" data-close="1">Abbrechen</button><button class="btn pri" type="button" id="rSave">Speichern</button>',
    onMount: function (body) {
      function recalc() {
        var km = parseNum($('#rKm', body).value), sec = parseTime($('#rTime', body).value), hf = parseNum($('#rHf', body).value);
        var out = [];
        if (km && sec) out.push('Pace ' + pace(sec / km) + ' pro km');
        if (km && sec && hf) out.push(nf(km * 1000 / ((sec / 60) * hf), 2) + ' m pro Herzschlag');
        if (km && App.D.runs.max30) {
          var sp = km / App.D.runs.max30 - 1;
          out.push('Sprung ' + (sp > 0 ? '+' : '') + nf(sp * 100, 1) + ' %');
        }
        var bar = $('#rCalc', body);
        bar.hidden = !out.length;
        bar.textContent = out.join(', ');
      }
      ['rKm', 'rTime', 'rHf'].forEach(function (id) { $('#' + id, body).addEventListener('input', recalc); });
      recalc();
      $('#rSave').addEventListener('click', function () {
        if (!requireConnection()) return;
        var km = parseNum($('#rKm', body).value);
        var payload = {
          date: dateISO, week: run.week, typ: run.typ, kmSoll: run.kmSoll,
          kmIst: km, sec: parseTime($('#rTime', body).value),
          hf: parseNum($('#rHf', body).value), z2: parseNum($('#rZ2', body).value), z3: parseNum($('#rZ3', body).value),
          temp: parseNum($('#rTemp', body).value), hm: parseNum($('#rHm', body).value),
          notiz: $('#rNote', body).value.trim(),
        };
        var ent = $('#rEnt', body); if (ent) payload.entkopplung = ent.value.trim();
        if (km != null) {
          var sum = Store.model.runs.filter(function (r) { return r.week === run.week && r.done && r.date !== dateISO; })
            .reduce(function (acc, r) { return acc + r.kmIst; }, 0) + km;
          payload.weekKm = Math.round(sum * 100) / 100;
        }
        submit('run', payload, 'Lauf ' + dShort(dateISO), $('#rSave'));
      });
    },
  });
}

/* ---- Kraft ---- */
function formStrength(block, exIndex, week) {
  var m = Store.model, K = m.kraft[block], ex = K.exercises[exIndex];
  if (!ex) return;
  var cols = K.columns.map(function (c) { return c.week; });
  var s = exSummary(ex, cols, week);
  var prior = s.lastWeek && s.lastWeek !== week ? s.lastWeek : null;

  var rows = ex.sets.map(function (st, i) {
    var cur = st.sessions[week];
    var ref = prior ? st.sessions[prior] : null;
    var reps = cur ? (cur.reps != null ? String(cur.reps).replace('.', ',') : cur.repsLabel) : '';
    var rir = cur && cur.rir != null ? String(cur.rir).replace('.', ',') : '';
    var wt = cur ? cur.weight : (ref ? ref.weight : (ex.start || ''));
    return '<div class="setrow" data-set="' + i + '">' +
      '<span class="sn">' + esc(st.satz.replace('Satz ', 'S')) + '</span>' +
      '<input class="input" data-f="reps" type="text" inputmode="decimal" placeholder="' + esc(ref ? String(ref.reps == null ? ref.repsLabel : ref.reps) : '') + '" value="' + esc(reps) + '">' +
      '<input class="input" data-f="rir" type="text" inputmode="decimal" placeholder="' + esc(ref && ref.rir != null ? String(ref.rir) : '') + '" value="' + esc(rir) + '">' +
      '<input class="input" data-f="weight" type="text" placeholder="' + esc(ref ? ref.weight : '') + '" value="' + esc(wt) + '">' +
      '</div>';
  }).join('');

  var html =
    '<div class="quote"><b>Ziel ' + esc(ex.zielReps) + ' Wiederholungen, RIR ' + esc(ex.rir) + '</b>' +
    '<div style="margin-top:3px">Start war ' + esc(ex.start) + '.' + (prior ? ' Letzte Session ' + esc(prior) + ': ' + esc(s.lastLabel) + ' bei ' + esc(s.lastWeight || 'BW') + '.' : '') + '</div></div>' +
    (App.D.weekPlan && App.D.weekPlan.entlastung ? '<div class="banner">' + IC.warn + '<div>' + esc(week) + ' ist eine Entlastungswoche: ein Satz weniger, Gewicht auf 80 Prozent. Pflicht.</div></div>' : '') +
    '<div class="setgrid"><div class="head"><span>Satz</span><span>Wdh</span><span>RIR</span><span>Gewicht</span></div>' + rows + '</div>' +
    '<div class="hint">Gewicht so schreiben wie im Sheet, zum Beispiel <code>110kg</code>, <code>BW</code>, <code>18kg pH</code> oder <code>30s</code>. Leere Felder löschen den Eintrag.</div>' +
    '<button class="btn quiet wide" type="button" data-info="kraftlogik">' + IC.book + 'Progression und Tempo</button>';

  Sheet.show({
    title: ex.name, sub: (block === 'A' ? 'Kraft A' : 'Kraft B') + ', Woche ' + week, html: html,
    footer: '<button class="btn quiet" type="button" data-close="1">Abbrechen</button><button class="btn pri" type="button" id="sSave">Speichern</button>',
    onMount: function (body) {
      $('#sSave').addEventListener('click', function () {
        if (!requireConnection()) return;
        var sets = $$('.setrow', body).map(function (row) {
          var g = function (f) { return $('[data-f="' + f + '"]', row).value.trim(); };
          var reps = g('reps'), rir = g('rir'), wt = g('weight');
          if (!reps && !wt) return null;
          var left = reps;
          if (reps && rir !== '') left = reps + '(' + rir + ')';
          return wt ? (left ? left + ' | ' + wt : wt) : left;
        });
        if (!sets.some(function (x) { return x; })) { Toast.show({ title: 'Nichts eingetragen', text: 'Mindestens einen Satz ausfüllen.', tone: 'err' }); return; }
        submit('strength', { block: block, exercise: ex.name, week: week, sets: sets }, ex.name + ', ' + week, $('#sSave'));
      });
    },
  });
}

/* ---- Absenden mit Rückgängig ---- */
function submit(op, payload, label, btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Speichert …'; }
  Store.write(op, payload, label).then(function (data) {
    Sheet.close(); render();
    Toast.show({
      title: 'Eingetragen', text: label + ' steht in der Tabelle.',
      action: data && data.logId ? {
        label: 'Rückgängig', icon: IC.undo,
        run: function () {
          return Store.undo(data.logId).then(function () {
            render();
            Toast.show({ title: 'Rückgängig gemacht', text: label + ' ist wieder wie vorher.' });
          });
        },
      } : null,
    });
  }).catch(function (err) {
    if (btn) { btn.disabled = false; btn.textContent = 'Speichern'; }
    if (err && err.code === 'queued') {
      Sheet.close(); render();
      Toast.show({ title: 'Gemerkt', text: err.message });
      return;
    }
    Toast.show({ title: 'Speichern ging nicht', text: (err && err.message) || 'Unbekannter Fehler.', tone: 'err' });
  });
}

    (Store.canWrite() ? '<button class="btn quiet wide" type="button" id="cReset">Verbindung trennen</button>' : '');

  Sheet.show({

        Store.cfg = null; LS.del('cfg'); LS.del('state');

      $('#cSave').addEventListener('click', function () {

        btn.disabled = true; btn.textContent = 'Prüft …';
        Store.cfg = { url: url, key: key };
        Store.refresh().then(function () {
          LS.set('cfg', Store.cfg);
          Sheet.close(); render();
          Toast.show({ title: 'Verbunden', text: 'Die App liest jetzt live aus der Tabelle.' });
        }).catch(function (err) {
          Store.cfg = LS.get('cfg', null);
          btn.disabled = false; btn.textContent = 'Verbinden';

          out.innerHTML = '<div class="banner">' + IC.warn + '<div>' + esc(msg) + '</div></div>';
        });
      });
    },
  });
}

      '<li>Lauf nach dem Lauf erfassen, Pace und Meter pro Herzschlag rechnet die App.</li>' +
      '<li>Kraft-Sätze in der Notation deines Sheets, mit Vorschlag aus der letzten Session.</li>' +
      '<li>Jede Kachel ist ein Knopf: dahinter steht die Regel im Wortlaut und der Beleg dazu.</li>' +
      '<li>Ohne Netz gemerkt und beim nächsten Start nachgeschickt.</li>' +
      '</ul>');
}

function render() {
  var m = Store.model;
  if (!m) {
    $('#navTitle').textContent = 'Athletic Training';
    $('#navSub').textContent = 'Noch nicht verbunden';
    $('#view').innerHTML = viewWelcome();
    $('#tabbar').parentNode.hidden = true;
    return;
  }
  $('#tabbar').parentNode.hidden = false;
  App.D = derive(m);
  var D = App.D;

  var titles = {
    heute: ['Athletic Training', 'Vienna City Marathon, 18. April 2027'],
    woche: ['Woche ' + D.week, D.weekPlan ? D.weekPlan.phase + ', ' + D.weekPlan.datum : ''],
    laufe: ['Läufe', D.runs.done.length + ' erfasst, ' + nf(D.runs.totalKm) + ' km'],
    kraft: ['Kraft', 'Woche ' + D.week + ', Double Progression'],
    plan: ['Plan', 'Gate am 31. Dezember, alle Belege'],
  }[App.tab];
  $('#navTitle').textContent = titles[0];
  $('#navSub').textContent = titles[1];

  var st = Store.status;
  $('#refreshBtn').dataset.state = st.state || 'snap';
  $('#refreshBtn').setAttribute('aria-label', 'Daten neu laden. ' + (st.text || ''));

  var html = App.tab === 'heute' ? viewHeute(D, m)
    : App.tab === 'woche' ? viewWoche(D, m)
      : App.tab === 'laufe' ? viewLaufe(D, m)
        : App.tab === 'kraft' ? viewKraft(D, m)
          : viewPlan(D, m);
  if (Store.queue.length) {
    html = '<div class="pendingbar">' + IC.clock + Store.queue.length + ' ' + (Store.queue.length === 1 ? 'Eintrag wartet' : 'Einträge warten') + ' auf Versand</div>' + html;
  }
  $('#view').innerHTML = html;

  $$('.tab').forEach(function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-tabid') === App.tab)); });

  if ($('#chWeeks')) chartWeeks($('#chWeeks'), D, m);
  if ($('#chWeeks2')) chartWeeks($('#chWeeks2'), D, m);
  if ($('#chMhb')) chartMhb($('#chMhb'), D);
  if ($('#chZones')) chartZones($('#chZones'), D);

  $('#scroll').scrollTop = App.scrollTop || 0;
}

function setTab(id) {
  if (App.tab === id) { $('#scroll').scrollTop = 0; App.scrollTop = 0; return; }
  App.tab = id; App.scrollTop = 0;
  LS.set('tab', id);
  render();
}

function bindGlobal() {
  $$('.tab').forEach(function (t) {
    t.addEventListener('click', function () { setTab(t.getAttribute('data-tabid')); });
  });

  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-info],[data-form],[data-tab],[data-act],[data-kblock],[data-close]') : null;
    if (!t) return;
    if (t.hasAttribute('data-close')) { Sheet.close(); return; }
    if (t.hasAttribute('data-kblock')) { kraftBlock = t.getAttribute('data-kblock'); App.scrollTop = $('#scroll').scrollTop; render(); return; }
    if (t.hasAttribute('data-tab')) { setTab(t.getAttribute('data-tab')); return; }
    if (t.hasAttribute('data-act')) {
      var a = t.getAttribute('data-act');
      if (a === 'setup') openSetup();
      else if (a === 'history') openHistory();
      return;
    }
    if (t.hasAttribute('data-info')) {
      var key = t.getAttribute('data-info');
      if (key) openInfo(key);
      return;
    }
    if (t.hasAttribute('data-form')) {
      var fo = t.getAttribute('data-form');
      if (fo === 'daily') formDaily(t.getAttribute('data-date'));
      else if (fo === 'run') formRun(t.getAttribute('data-date'));
      else if (fo === 'strength') formStrength(t.getAttribute('data-block'), parseInt(t.getAttribute('data-ex'), 10), t.getAttribute('data-week'));
      else if (fo === 'weekly') formWeekly(t.getAttribute('data-week'));
      else if (fo === 'gate') formGate(parseInt(t.getAttribute('data-index'), 10));
    }
  });

  var scroll = $('#scroll'), app = $('#app'), ticking = false;
  scroll.addEventListener('scroll', function () {
    App.scrollTop = scroll.scrollTop;
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      app.classList.toggle('scrolled', scroll.scrollTop > 10);
      ticking = false;
    });
  }, { passive: true });

  $('#refreshBtn').addEventListener('click', function () {
    if (!NET) { openPreviewNote(); return; }
    var b = $('#refreshBtn');
    b.classList.add('spin');
    Store.refresh().then(function () { render(); }, function (err) {
      Toast.show({ title: 'Laden ging nicht', text: (err && err.message) || '', tone: 'err' });
    }).then(function () { b.classList.remove('spin'); });
  });
  $('#setupBtn').addEventListener('click', function () { if (NET) openSetup(); else openPreviewNote(); });

  window.addEventListener('online', function () {
    Store.flush().then(function (n) {
      if (n) { render(); Toast.show({ title: 'Nachgeschickt', text: n + ' Eintrag' + (n > 1 ? 'e' : '') + ' ist jetzt in der Tabelle.' }); }
    });
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    Store.flush();
    if (Store.canWrite() && Store.meta && Store.meta.fetchedAt && Date.now() - new Date(Store.meta.fetchedAt).getTime() > 120000) {
      Store.refresh({ quiet: true }).then(function () { render(); }, function () {});
    }
  });

  var rt;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(render, 150); });
}

/* ========================================================================== */
/*  Start                                                                     */
/* ========================================================================== */
function boot(snapshot) {
  Store.init(snapshot);
  Store.history = LS.get('history', []);
  App.tab = LS.get('tab', 'heute');
  if (['heute', 'woche', 'laufe', 'kraft', 'plan'].indexOf(App.tab) < 0) App.tab = 'heute';

  Sheet.mount();
  Toast.mount();
  if (!NET) { $('#setupBtn').innerHTML = IC.book; }

  $('#tabbar').innerHTML = TABS.map(function (t) {
    return '<button class="tab" type="button" role="tab" data-tabid="' + t.id + '" aria-selected="' + (t.id === App.tab) + '">' +
      t.icon + '<span class="lbl">' + esc(t.label) + '</span></button>';
  }).join('');

  Store.on(function () {
    var b = $('#refreshBtn');
    if (b) b.dataset.state = Store.status.state || 'snap';
  });

  bindGlobal();
  Store.setStatus(Store.canWrite() ? 'busy' : 'snap', Store.canWrite() ? 'Tabelle wird gelesen' : 'Eingebauter Stand');
  render();

  if (Store.canWrite()) {
    Store.flush().then(function () { return Store.refresh({ quiet: true }); })
      .then(function () { render(); }, function (err) {
        render();
        if (err && err.code === 'bad_key') Toast.show({ title: 'Zugangscode passt nicht', text: 'In den Einstellungen neu eintragen.', tone: 'err' });
      });
  }

  if ('serviceWorker' in navigator && location.protocol === 'https:' && window.W27_PWA) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
}

</script>
