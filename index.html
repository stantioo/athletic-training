<style>
/* ============================================================================
   Athletic Training — Design-System
   Nachbau des Vokabulars aus den Referenz-Screenshots, in Weinrot:
   tiefer Farbverlauf als Grund, Glaskarten darauf, Verlaufs-Hero mit
   Aktionsreihe, 2x2-Kennzahlkacheln mit Icon-Chip, fette Sektionstitel
   AUSSERHALB der Karten, Glas-Tableiste unten, schwebender Aktionsknopf.
   Bedienelemente in iOS-Maßen: Schalter 51x31, Ziele mindestens 44.
   Bewegung nach der apple-design-Spezifikation.
   ========================================================================= */

:root {
  color-scheme: dark;

  /* -- Grund: tiefer Weinverlauf, nicht Schwarz ------------------------- */
  --bg:       #150609;
  --bg-top:   #33101C;
  --bg-mid:   #1B0810;
  --bg-deep:  #0D0406;

  /* -- Glas ------------------------------------------------------------- */
  --glass:      rgba(255, 255, 255, 0.075);
  --glass-2:    rgba(255, 255, 255, 0.048);
  --glass-str:  rgba(255, 255, 255, 0.115);
  --edge:       rgba(255, 255, 255, 0.115);
  --edge-soft:  rgba(255, 255, 255, 0.075);
  --edge-str:   rgba(255, 255, 255, 0.20);

  /* -- Ink -------------------------------------------------------------- */
  --ink:    #FFFFFF;
  --ink-2:  rgba(255, 255, 255, 0.68);
  --ink-3:  rgba(255, 255, 255, 0.44);

  /* -- Akzent ----------------------------------------------------------- */
  --wine:      #C8354A;
  --wine-deep: #7A1526;
  --wine-mid:  #9E2337;
  --wine-hi:   #F0808F;
  --wine-dim:  rgba(200, 53, 74, 0.20);
  --wine-line: rgba(200, 53, 74, 0.45);

  /* -- Status. Immer mit Symbol und Wort, nie Farbe allein. ------------- */
  --good:  #4ECB8E;
  --warn:  #F2B33D;
  --good-dim: rgba(78, 203, 142, 0.16);
  --warn-dim: rgba(242, 179, 61, 0.16);

  /* -- Severity-Rampe, ein Hue, monotone Helligkeit --------------------- */
  --sev-0: #6F5222;
  --sev-1: #906A28;
  --sev-2: #B18334;
  --sev-3: #CF9A3D;
  --sev-4: #EAAF49;
  --sev-5: #FFC455;

  /* -- Schrift: System, auf Apple also SF Pro mit echten optischen Größen */
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;

  /* -- Raum ------------------------------------------------------------- */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s7: 32px;
  --gutter: 18px;
  --col: 640px;

  /* -- Radien: groß, wie in den Referenzen ------------------------------ */
  --r-card:  24px;
  --r-tile:  20px;
  --r-inner: 14px;
  --r-ctl:   12px;
  --r-sheet: 28px;

  /* -- Bewegung --------------------------------------------------------- */
  --ease-out:    cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --d-press: 140ms;
  --d-fast:  180ms;
  --d-ui:    240ms;

  --tab-h: 58px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

/* ---------- Reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: var(--wine-hi); text-decoration: none; }
h1, h2, h3, p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
[hidden] { display: none !important; }
svg:not([width]) { width: 1em; height: 1em; flex-shrink: 0; vertical-align: -0.13em; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--wine-hi); outline-offset: 2px; border-radius: 8px; }

/* ============================================================================
   Rahmen: nur der Inhalt scrollt
   ========================================================================= */
.app {
  position: relative;
  height: 100svh; max-height: 100svh;
  display: flex; flex-direction: column;
  overflow: hidden;
  background:
    radial-gradient(120% 56% at 50% -16%, var(--bg-top) 0%, var(--bg-mid) 42%, var(--bg-deep) 100%),
    var(--bg);
}
/* Zweiter, weicher Lichtpunkt oben rechts, wie in den Referenzen. */
.app::before {
  content: '';
  position: absolute; inset: -8% -20% auto auto;
  width: 78%; max-width: 460px; aspect-ratio: 1;
  background: radial-gradient(closest-side, rgba(240, 128, 143, 0.13), rgba(240, 128, 143, 0) 70%);
  pointer-events: none; z-index: 0;
}

/* ---------- Kopf: Name, Grußzeile, runde Aktionen ---------- */
.nav {
  position: relative; z-index: 3; flex-shrink: 0;
  padding: calc(var(--safe-t) + 12px) var(--gutter) 12px;
  transition: background var(--d-ui) var(--ease-out), border-color var(--d-ui) var(--ease-out);
  border-bottom: 1px solid transparent;
}
.app.scrolled .nav {
  background: rgba(24, 8, 13, 0.62);
  backdrop-filter: blur(26px) saturate(170%);
  -webkit-backdrop-filter: blur(26px) saturate(170%);
  border-bottom-color: var(--edge-soft);
}
.nav-inner { max-width: var(--col); margin: 0 auto; display: flex; align-items: center; gap: var(--s3); }
.nav-titles { flex: 1; min-width: 0; }
.nav-titles h1 {
  font-size: 27px; font-weight: 700; letter-spacing: -0.026em; line-height: 1.1;
  transition: font-size var(--d-ui) var(--ease-out);
}
.nav-titles .sub {
  color: var(--ink-2); font-size: 13.5px; margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  max-height: 20px; opacity: 1;
  transition: max-height var(--d-ui) var(--ease-out), opacity var(--d-ui) var(--ease-out);
}
.app.scrolled .nav-titles h1 { font-size: 20px; }
.app.scrolled .nav-titles .sub { max-height: 0; opacity: 0; }
.nav-actions { display: flex; align-items: center; gap: var(--s2); flex-shrink: 0; }

.iconbtn {
  width: 40px; height: 40px; flex-shrink: 0; position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: var(--glass); border: 1px solid var(--edge);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  color: var(--ink);
  transition: transform var(--d-press) var(--ease-out), background var(--d-fast) var(--ease-out);
}
.iconbtn:active { transform: scale(0.9); background: var(--glass-str); }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn .dot {
  position: absolute; top: 8px; right: 9px;
  width: 8px; height: 8px; border-radius: 50%;
  border: 2px solid #2B0A14;
}
.iconbtn[data-state="live"] .dot { background: var(--good); }
.iconbtn[data-state="warn"] .dot { background: var(--warn); }
.iconbtn[data-state="busy"] .dot { background: var(--ink-2); animation: blink 1.1s ease-in-out infinite; }
.iconbtn[data-state="snap"] .dot { display: none; }
@keyframes blink { 50% { opacity: 0.28; } }
.iconbtn.spin svg { animation: spin 900ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Scrollbereich ---------- */
.scroll { position: relative; z-index: 1; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.scroll::-webkit-scrollbar { width: 0; height: 0; }
.view {
  max-width: var(--col); margin: 0 auto;
  padding: var(--s2) var(--gutter) calc(var(--tab-h) + var(--safe-b) + 32px);
  display: flex; flex-direction: column; gap: var(--s4);
}

/* ---------- Glas-Tableiste ---------- */
.tabbar {
  position: relative; z-index: 4; flex-shrink: 0;
  padding: 7px var(--s3) calc(var(--safe-b) + 7px);
  background: rgba(26, 9, 14, 0.60);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border-top: 1px solid var(--edge-soft);
}
.tabbar-inner { max-width: var(--col); margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.tab {
  min-height: 44px; padding: 5px 2px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  border-radius: var(--r-inner); color: var(--ink-3);
  transition: color var(--d-fast) var(--ease-out), background var(--d-fast) var(--ease-out), transform var(--d-press) var(--ease-out);
}
.tab:active { transform: scale(0.93); }
.tab svg { width: 23px; height: 23px; }
.tab .lbl { font-size: 10.5px; font-weight: 600; letter-spacing: 0.005em; }
.tab[aria-selected="true"] { color: var(--ink); background: var(--wine-dim); }
.tab[aria-selected="true"] svg { color: var(--wine-hi); }


/* ============================================================================
   Sektionstitel, außerhalb der Karten
   ========================================================================= */
.sec {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3);
  margin: var(--s3) 2px calc(-1 * var(--s2) + 2px);
}
.sec h2 { font-size: 21px; font-weight: 700; letter-spacing: -0.022em; text-wrap: balance; }
.sec .more { font-size: 14px; font-weight: 600; color: var(--wine-hi); white-space: nowrap; display: inline-flex; align-items: center; gap: 3px; }
.sec .more svg { width: 12px; height: 12px; }

/* ============================================================================
   Glaskarte
   ========================================================================= */
.card {
  position: relative;
  border-radius: var(--r-card);
  background: var(--glass);
  backdrop-filter: blur(22px) saturate(150%);
  -webkit-backdrop-filter: blur(22px) saturate(150%);
  border: 1px solid var(--edge);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.09) inset, 0 10px 28px rgba(0, 0, 0, 0.26);
  padding: var(--s4);
  overflow: hidden;
  min-width: 0;
}
.card.tap { text-align: left; width: 100%; display: block; transition: transform var(--d-press) var(--ease-out); }
.card.tap:active { transform: scale(0.985); }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s3); }
.card-top h3 { font-size: 17px; font-weight: 600; letter-spacing: -0.012em; }
.card-top .meta { color: var(--ink-3); font-size: 12.5px; font-family: var(--mono); text-align: right; flex-shrink: 0; }
.note { color: var(--ink-2); font-size: 14px; line-height: 1.5; }
.note.dim { color: var(--ink-3); font-size: 12.5px; }
.hr { height: 1px; background: var(--edge-soft); border: 0; margin: var(--s4) 0; }

/* Icon-Chip, wie bei den Health-Kacheln */
.chip-ic {
  width: 32px; height: 32px; flex-shrink: 0; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  background: var(--wine-dim); border: 1px solid var(--wine-line); color: var(--wine-hi);
}
.chip-ic svg { width: 16px; height: 16px; }
.chip-ic.amber { background: var(--warn-dim); border-color: rgba(242, 179, 61, 0.4); color: var(--warn); }
.chip-ic.green { background: var(--good-dim); border-color: rgba(78, 203, 142, 0.4); color: var(--good); }

/* ============================================================================
   Hero mit Verlauf
   ========================================================================= */
.hero {
  border-radius: var(--r-card);
  padding: var(--s5);
  background: linear-gradient(158deg, #C8354A 0%, #9E2337 46%, #6B1223 100%);
  border: 1px solid rgba(255, 255, 255, 0.19);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.26) inset, 0 14px 36px rgba(107, 18, 35, 0.46);
  overflow: hidden; position: relative;
}
.hero::after {
  content: ''; position: absolute; inset: -60% -30% auto auto;
  width: 70%; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255, 255, 255, 0.16), transparent 70%);
  pointer-events: none;
}
.hero .lead { font-size: 14px; color: rgba(255, 255, 255, 0.76); font-weight: 500; }
.hero .big {
  font-size: 52px; line-height: 1; font-weight: 700; letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums; margin-top: 4px;
}
.hero .big u { font-style: normal; text-decoration: none; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; color: rgba(255, 255, 255, 0.66); margin-left: 8px; }
.hero .pills { display: flex; flex-wrap: wrap; gap: 7px; margin-top: var(--s3); }
.pill2 {
  display: inline-flex; align-items: center; gap: 5px;
  height: 29px; padding: 0 12px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.2);
  font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.pill2 svg { width: 12px; height: 12px; }
.pill2.q { background: rgba(0, 0, 0, 0.2); border-color: rgba(255, 255, 255, 0.16); font-weight: 500; color: rgba(255, 255, 255, 0.86); }

/* Aktionsreihe im Hero */
.acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: var(--s4); }
.act {
  min-height: 60px; padding: 9px 4px; border-radius: var(--r-inner);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  background: rgba(0, 0, 0, 0.22); border: 1px solid rgba(255, 255, 255, 0.17);
  color: #fff;
  transition: transform var(--d-press) var(--ease-out), background var(--d-fast) var(--ease-out);
}
.act:active { transform: scale(0.95); background: rgba(0, 0, 0, 0.34); }
.act svg { width: 19px; height: 19px; }
.act span { font-size: 12px; font-weight: 600; letter-spacing: -0.004em; text-align: center; line-height: 1.2; }

/* ============================================================================
   Kennzahlkacheln, 2x2
   ========================================================================= */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); }
@media (min-width: 600px) { .grid2.w4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

.stat {
  border-radius: var(--r-tile); padding: var(--s3) var(--s3) var(--s3);
  background: var(--glass); border: 1px solid var(--edge);
  backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08) inset;
  text-align: left; width: 100%; min-width: 0;
  display: flex; flex-direction: column;
  transition: transform var(--d-press) var(--ease-out), background var(--d-fast) var(--ease-out);
}
.stat:active { transform: scale(0.97); background: var(--glass-str); }
.stat .head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s2); }
.stat .lbl { font-size: 13.5px; font-weight: 600; letter-spacing: -0.006em; line-height: 1.25; }
.stat .val {
  font-size: 27px; font-weight: 700; letter-spacing: -0.028em; line-height: 1.05;
  font-variant-numeric: tabular-nums; margin-top: var(--s3);
}
.stat .val u { font-style: normal; text-decoration: none; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-left: 4px; letter-spacing: 0; }
.stat .mini { margin-top: var(--s2); height: 30px; }
.stat .foot { margin-top: 6px; }
.stat.lg .val { font-size: 32px; }

.delta { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.delta.good { color: var(--good); }
.delta.warn { color: var(--warn); }
.delta svg { width: 10px; height: 10px; }

/* ============================================================================
   Fortschritt
   ========================================================================= */
.pscale { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; margin-bottom: 6px; }
.pscale b { color: var(--ink); font-weight: 700; }
.pbar { position: relative; height: 9px; border-radius: 6px; background: rgba(0, 0, 0, 0.28); overflow: hidden; border: 1px solid var(--edge-soft); }
.pbar i { position: absolute; inset: 0; width: 0; border-radius: 6px; background: linear-gradient(90deg, var(--wine-deep), var(--wine) 70%, var(--wine-hi)); transition: width 420ms var(--ease-out); }
.pbar.warn i { background: linear-gradient(90deg, #9A6F22, var(--warn)); }
.pbar.good i { background: linear-gradient(90deg, #1F7A52, var(--good)); }
.pbar.sm { height: 6px; }

/* Segment-Balken, wie die Glukose-Anzeige */
.segbar { display: flex; gap: 3px; align-items: flex-end; height: 26px; }
.segbar i { flex: 1; border-radius: 3px; background: rgba(255, 255, 255, 0.11); height: 62%; }
.segbar i.on { height: 100%; }
.segbar-legend { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-3); margin-top: 6px; font-variant-numeric: tabular-nums; }

/* Ring */
.ringwrap { display: flex; align-items: center; gap: var(--s4); }
.ringwrap > .rng { width: 92px; height: 92px; flex-shrink: 0; }
.ringwrap > .rng svg { width: 92px; height: 92px; display: block; }

/* ============================================================================
   Listen im iOS-Stil, Trenner ab dem Text eingerückt
   ========================================================================= */
.list { display: flex; flex-direction: column; }
.lrow {
  position: relative;
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s3) 0; width: 100%; text-align: left;
  transition: background var(--d-fast) var(--ease-out);
}
.lrow + .lrow::before {
  content: ''; position: absolute; top: 0; right: 0; height: 1px;
  left: 0; background: var(--edge-soft);
}
.lrow.inset + .lrow.inset::before { left: 50px; }
.lrow:active { background: rgba(255, 255, 255, 0.045); }
.av {
  width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--glass-str); border: 1px solid var(--edge);
  font-size: 12.5px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums;
}
.av svg { width: 17px; height: 17px; }
.av.wine { background: var(--wine-dim); border-color: var(--wine-line); color: var(--wine-hi); }
.av.amber { background: var(--warn-dim); border-color: rgba(242, 179, 61, 0.4); color: var(--warn); }
.av.green { background: var(--good-dim); border-color: rgba(78, 203, 142, 0.4); color: var(--good); }
.lrow .txt { flex: 1; min-width: 0; }
.lrow .txt .t { display: block; font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .txt .s { display: block; font-size: 13px; color: var(--ink-2); margin-top: 1px; line-height: 1.35; }
.lrow .end { flex-shrink: 0; text-align: right; max-width: 44%; }
.lrow .end .v { display: block; font-size: 15.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -0.012em; }
.lrow .end .s { display: block; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; margin-top: 1px; }
.chev { color: var(--ink-3); flex-shrink: 0; display: inline-flex; }
.chev svg { width: 13px; height: 13px; }

/* Definitionsliste */
.dl { display: flex; flex-direction: column; }
.dl > div { display: flex; justify-content: space-between; gap: var(--s4); padding: 10px 0; position: relative; }
.dl > div + div::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--edge-soft); }
.dl dt { color: var(--ink-2); font-size: 14.5px; }
.dl dd { margin: 0; font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.dl.stack > div { flex-direction: column; gap: 3px; }
.dl.stack dt { color: var(--ink); font-weight: 600; }
.dl.stack dd { text-align: left; font-weight: 400; color: var(--ink-2); font-size: 13.5px; }

/* ============================================================================
   Wochenstreifen
   ========================================================================= */
.wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.wkd {
  position: relative; border-radius: var(--r-inner); padding: 9px 2px 8px;
  background: var(--glass-2); border: 1px solid var(--edge-soft);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  transition: transform var(--d-press) var(--ease-out);
}
.wkd:active { transform: scale(0.93); }
.wkd[aria-current="date"] { border-color: rgba(240, 128, 143, 0.55); background: var(--wine-dim); }
.wkd.future { opacity: 0.48; }

    return String(v).replace(/ /g, ' ').trim();
  };
  const N = (v) => {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    const t = String(v).trim();
    if (!t || t === '-' || t === '—' || t === '–') return null;
    const m = t.replace(/\s/g, '').replace(/\./g, (mm, off, str) => (/,/.test(str) ? '' : '.')).replace(',', '.');
    const cleaned = m.replace(/[^0-9.\-]/g, '');
    if (!cleaned || cleaned === '-' || cleaned === '.') return null;
    const n = parseFloat(cleaned);
    return isFinite(n) ? n : null;
  };
  const pad = (n) => String(n).padStart(2, '0');
  function isoFromDate(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  /** Datum aus 'TT.MM.JJJJ', Date, oder Excel-Serial. */
  function toISO(v) {

    if (v instanceof Date) return isoFromDate(v);
    if (typeof v === 'number') {
      if (v < 1 || v > 60000) return null;
      const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000);
      return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
    }
    const s = String(v);
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[1] + '-' + m[2] + '-' + m[3];
    m = s.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);

  }
  /** Sekunden aus 'hh:mm:ss', Date, oder Excel-Tagesbruchteil. */
  function toSeconds(v) {

      if (v <= 0) return null;
      return Math.round((v % 1) * 86400);
    }
    if (v instanceof Date) return v.getUTCHours() * 3600 + v.getUTCMinutes() * 60 + v.getUTCSeconds();
    const m = String(v).match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
    if (!m) return null;
    return (+m[1]) * 3600 + (+m[2]) * 60 + (+(m[3] || 0));
  }
  /** Wochen-Label normalisieren: 'W04\nE' und 'W04 / E' → 'W04'. */
  const weekKey = (v) => S(v).split(/[\n\r]|\s\/\s/)[0].trim();
  const isWeek = (v) => /^(B[12]|W\d{2}|G[1-5])$/.test(weekKey(v));

  /* ---------- Zeilen-Helfer ---------- */
  const rowEmpty = (r) => !r || r.every((c) => S(c) === '');
  const findRow = (rows, from, test) => {
    for (let i = from; i < rows.length; i++) if (test(rows[i], i)) return i;
    return -1;
  };
  const headingAt = (rows, text) =>
    findRow(rows, 0, (r) => S(r && r[0]).replace(/\s+/g, ' ').indexOf(text) === 0);

  /**
   * Tabelle nach einer Überschrift lesen.
   * Überspringt die Kopfzeile, liest bis zur ersten Zeile ohne Inhalt in Spalte A.
   */
  function tableAfter(rows, heading, opts) {
    const o = opts || {};
    const h = headingAt(rows, heading);
    if (h < 0) return [];
    let start = h + 1;
    if (o.skipHeader !== false) {
      // erste nicht-leere Zeile ist die Kopfzeile
      while (start < rows.length && rowEmpty(rows[start])) start++;
      start++;
    }
    const out = [];
    for (let i = start; i < rows.length; i++) {
      const r = rows[i] || [];
      if (S(r[0]) === '') break;
      if (o.stop && o.stop(r)) break;
      out.push(r.map(S));
    }
    return out;
  }

  /** Absätze nach einer Überschrift: Zeilen mit Inhalt nur in Spalte A. */
  function paragraphsAfter(rows, heading, limit) {
    const h = headingAt(rows, heading);
    if (h < 0) return [];
    const out = [];
    for (let i = h + 1; i < rows.length; i++) {
      const r = rows[i] || [];
      const a = S(r[0]);
      if (a === '') { if (out.length) break; else continue; }
      if (r.slice(1).some((c) => S(c) !== '')) break;
      out.push(a);
      if (limit && out.length >= limit) break;
    }
    return out;
  }

  /* ========================================================================
     Haupt-Parser
     ===================================================================== */
  function parseSheets(sheets) {
    const R = (name) => sheets[name] || [];

    /* ---------------- Übersicht ---------------- */
    const ov = R('Übersicht');
    const roadmap = tableAfter(ov, 'ROADMAP BIS RACE DAY').map((r) => ({
      block: r[0], zeitraum: r[1], fokus: r[2], kmWoche: r[3], longRun: r[4], prinzip: r[5],
    }));
    const ausgangslage = tableAfter(ov, 'AUSGANGSLAGE', { skipHeader: false }).map((r) => ({ label: r[0], text: r[1] }));
    const schritt0 = paragraphsAfter(ov, 'SCHRITT 0');
    const wochenstruktur = tableAfter(ov, 'WOCHENSTRUKTUR — 5 SLOTS').map((r) => ({
      tag: r[0], einheit: r[1], dauer: r[2], inhalt: r[3],
    }));
    const ziel = S(ov[1] && ov[1][0]);

    /* ---------------- Tagesprotokoll ---------------- */
    const tp = R('Tagesprotokoll');
    const tpHead = findRow(tp, 0, (r) => S(r && r[0]) === 'Datum');
    const days = [];
    for (let i = tpHead + 1; i < tp.length; i++) {
      const r = tp[i] || [];
      const iso = toISO(r[0]);
      if (!iso) { if (days.length) break; else continue; }
      const done = S(r[5]).toLowerCase();
      days.push({
        row: i + 1, date: iso, tag: S(r[1]), week: weekKey(r[2]),
        sehnen: N(r[3]), gewicht: N(r[4]),
        done: done.indexOf('ja') === 0 ? true : done.indexOf('nein') === 0 ? false : null,
        plan: S(r[6]), notiz: S(r[7]),
      });
    }

    /* ---------------- Laufdaten ---------------- */
    const ld = R('Laufdaten');
    const ldHead = findRow(ld, 0, (r) => S(r && r[0]) === 'Datum');
    const runs = [];
    for (let i = ldHead + 1; i < ld.length; i++) {
      const r = ld[i] || [];
      const iso = toISO(r[0]);
      if (!iso) { if (runs.length) break; else continue; }
      const kmIst = N(r[4]);
      const sec = toSeconds(r[5]);
      const hf = N(r[7]);
      runs.push({
        row: i + 1, date: iso, week: weekKey(r[1]), typ: S(r[2]),
        kmSoll: N(r[3]), kmIst, sec, hf,
        paceSec: kmIst && sec ? sec / kmIst : null,
        mhb: kmIst && sec && hf ? Math.round((kmIst * 1000) / ((sec / 60) * hf) * 100) / 100 : null,
        z2: N(r[8]), z3: N(r[9]), temp: N(r[10]), hm: N(r[11]),
        entkopplung: (S(r[13]) === '—' ? '' : S(r[13])),
        notiz: S(r[14]),
        done: kmIst != null,
      });
    }

    /* ---------------- Lauf: Wochenplan + Wochenwerte ---------------- */
    const lf = R('Lauf');
    const weeks = [];
    const wpHead = findRow(lf, 0, (r) => S(r && r[0]) === 'Woche' && S(r[1]) === 'Datum');
    for (let i = wpHead + 1; i < lf.length; i++) {
      const r = lf[i] || [];
      if (!isWeek(r[0])) { if (weeks.length) break; else continue; }
      const spikeRaw = r[6];
      weeks.push({
        row: i + 1, week: weekKey(r[0]), datum: S(r[1]), phase: S(r[2]),
        l1: N(r[3]), l2: N(r[4]), lr: N(r[5]),
        spike: typeof spikeRaw === 'number' ? spikeRaw : N(spikeRaw),
        spikeLabel: typeof spikeRaw === 'string' && N(spikeRaw) == null ? S(spikeRaw) : null,
        kmSoll: N(r[7]), zusatz: S(r[8]), kmIstSheet: N(r[9]),
        sehnenMax: N(r[10]), trend: N(r[11]), notiz: S(r[12]),
        entlastung: /ENTLASTUNG/i.test(S(r[2])),
      });
    }
    const weekly = [];
    const wvHead = findRow(lf, 0, (r) => S(r && r[0]) === 'Woche' && /Gewicht/.test(S(r[1])));
    for (let i = wvHead + 1; i < lf.length; i++) {
      const r = lf[i] || [];
      if (!isWeek(r[0])) { if (weekly.length) break; else continue; }
      weekly.push({
        row: i + 1, week: weekKey(r[0]), gewicht: N(r[1]),
        ruhepuls: N(r[2]), hrv: N(r[3]), schlaf: N(r[4]), bemerkung: S(r[5]),
      });
    }

    /* ---------------- Kraft ---------------- */
    const kr = R('Kraft');
    const kraft = { A: { title: '', columns: [], headerRow: 0, exercises: [] }, B: { title: '', columns: [], headerRow: 0, exercises: [] } };

      const r = kr[i] || [];

      if (/^KRAFT B/.test(a)) { blk = 'B'; kraft.B.title = a; ex = null; continue; }
      if (!blk) continue;
      if (a === 'Übung') {
        kraft[blk].headerRow = i + 1;
        kraft[blk].columns = [];
        for (let c = 5; c < r.length; c++) {
          const lab = weekKey(r[c]);
          if (lab) kraft[blk].columns.push({ col: c + 1, week: lab, entlastung: /\bE\b/.test(S(r[c])) });
        }
        continue;
      }
      if (/^Notation/i.test(a)) { blk = null; ex = null; continue; }
      const satz = S(r[1]);
      if (!/^Satz/i.test(satz)) continue;
      if (a) {
        ex = { name: a, zielReps: S(r[2]), rir: S(r[3]), start: S(r[4]), sets: [] };

      kraft[blk].columns.forEach((c) => {

        items.push({ uebung: S(r[0]), dosis: S(r[1]), tempo: S(r[2]), ziel: S(r[3]), hinweis: S(r[4]) });

    }

    /* ---------------- Fueling ---------------- */
    const fu = R('Fueling');
    const fueling = {
      dayTypes: tableAfter(fu, 'TAGESZIELE NACH TAGESTYP').map((r) => ({ typ: r[0], gkg: r[1], g: r[2], protein: r[3], hinweis: r[4] })),
      progression: tableAfter(fu, 'FUELING-PROGRESSION').map((r) => ({ phase: r[0], dauer: r[1], waehrend: r[2], fluessig: r[3], ziel: r[4] })),
      sources: tableAfter(fu, 'Quelle', { skipHeader: false }).map((r) => ({ quelle: r[0], portion: r[1], carbs: r[2], ballast: r[3], praxis: r[4] })),
      raceDay: paragraphsAfter(fu, 'RENNTAG'),
    };

    /* ---------------- Gate ---------------- */
    const gt = R('Gate Dezember');
    const gate = {
      deadline: S(gt[1] && gt[1][0]),
      kriterien: [], anzahlJa: null, empfehlung: '',
      szenarien: tableAfter(gt, 'DIE RECHNUNG').map((r) => ({ szenario: r[0], zeit: r[1], steigerung: r[2], bewertung: r[3] })),
      einschaetzung: paragraphsAfter(gt, 'EHRLICHE EINSCHÄTZUNG'),
    };
    for (let i = 0; i < gt.length; i++) {
      const r = gt[i] || [];
      const a = S(r[0]);
      if (/^\d\.\s/.test(a) && S(r[1])) gate.kriterien.push({ row: i + 1, kriterium: a, messung: S(r[1]), status: S(r[2]), warum: S(r[3]) });
      if (a === 'Anzahl JA') gate.anzahlJa = N(r[2]) != null ? N(r[2]) : N(r[1]);
      if (a === 'Empfehlung') gate.empfehlung = S(r[1]);
    }

    /* ---------------- Quellen ---------------- */
    const qu = R('Quellen');
    const quellen = {
      sources: tableAfter(qu, 'PRIMÄRQUELLEN').map((r) => ({
        nr: N(r[0]), thema: r[1], quelle: r[2], jahr: r[3], link: r[4], folgt: r[5], belastbarkeit: r[6],
      })).filter((x) => x.thema),
      caveats: paragraphsAfter(qu, 'WO DIE EVIDENZ SCHWACH IST'),
    };

    /* ---------------- Legende ---------------- */
    const lg = R('Legende');
    const legende = {
      abbr: tableAfter(lg, 'ABKÜRZUNGEN', { skipHeader: false }).map((r) => ({ k: r[0], v: r[1] })),
      rules: tableAfter(lg, 'DIE SECHS REGELN', { skipHeader: false }).map((r) => ({ k: r[0], v: r[1] })),
    };

    /* ---------------- Roh-Notizen je Tab (Fallback für „mehr Info") -------- */
    const rawNotes = {};
    Object.keys(sheets).forEach((name) => {
      const rows = sheets[name] || [];
      const out = [];
      rows.forEach((r) => {
        const a = S(r && r[0]);
        if (!a || a.length < 12) return;
        if (r.slice(1).some((c) => S(c) !== '')) return;
        out.push(a);
      });
      if (out.length) rawNotes[name] = out;
    });

    return {
      ziel, roadmap, ausgangslage, schritt0, wochenstruktur,
      days, runs, weeks, weekly, kraft,
      sehnen: { phases: sehnenPhases, wann: sehnenWann, tests: sehnenTests },
      fueling, gate, quellen, legende, rawNotes,

  }

  /** 'Reps(RIR) | Gewicht' → strukturiert. Auch '8pB(2) | 16kg pH' und '30s'. */
  function parseSet(raw) {
    const parts = String(raw).split('|').map((s) => s.trim());
    const left = parts[0] || '';
    const right = parts[1] || '';

      raw: String(raw),
      reps: m ? parseFloat(m[1].replace(',', '.')) : null,
      rir: m ? (N(m[3]) != null ? N(m[3]) : null) : null,
      perLeg: m ? m[2] === 'pB' : false,
      seconds: sec ? +sec[1] : null,
      repsLabel: left,
      weight: right,
      weightKg: right ? N(right) : null,
      perHand: /pH/i.test(right),

  /* ---------- SheetJS-Adapter (Build + Drive-Pfad) ---------- */

    const out = {};
    wb.SheetNames.forEach((name) => {

    kmByWeek: kmByWeek,
    bestWeekKm: Object.keys(kmByWeek).length ? Math.max.apply(null, Object.keys(kmByWeek).map(function (k) { return kmByWeek[k]; })) : 0,
    z3recent: mean(runsDone.slice(-3).map(function (r) { return r.z3; }).filter(function (v) { return v != null; })),
    mhbSeries: runsDone.filter(function (r) { return r.mhb != null; }),
    max30: max30, nextRun: nextRun, nextSpike: nextSpike,
  };

  /* Woche */
  var weekRunsPlanned = weekDays.filter(function (d) { return isRunPlan(d.plan); });
  var weekIst = kmByWeek[week] || 0;
  var weekRunsDone = model.runs.filter(function (r) { return r.week === week && r.done; }).length;

  var phaseKey = 'PHASE 1';
  var wIdx = model.weeks.map(function (w) { return w.week; }).indexOf(week);
  var wNum = /^W(\d\d)$/.test(week) ? parseInt(week.slice(1), 10) : (/^G/.test(week) ? 99 : 0);

  else if (wNum >= 5) phaseKey = 'PHASE 2';

    { label: 'Beste Woche', now: runs.bestWeekKm, target: 25, unit: 'km', text: 'Beste Woche bisher ' + nf(runs.bestWeekKm) + ' km von 25' },
    { label: 'Längster Long Run', now: longestLR ? longestLR.kmIst : 0, target: 11.6, unit: 'km', text: longestLR ? 'Längster Long Run ' + nf(longestLR.kmIst, 2) + ' km von 11,6' : 'Noch kein Long Run erfasst' },
    { label: 'Sehnen still', now: tend.calm28, target: 28, unit: 'Tage', text: 'Ruhige Tage in den letzten 28: ' + tend.calm28 + ', aktuelle Serie ' + tend.streak },
    // Das Kriterium ist 6:15 pro km ÜBER 10 km. Nur die Pace zu vergleichen
    // überschätzt den Stand, deshalb zusätzlich mit der Distanz gewichtet.
    {
      label: 'Tempo-Reserve',
      now: bestPace ? clamp(375 / bestPace.paceSec, 0, 1.2) * clamp(bestPace.kmIst / 10, 0, 1) * 100 : 0,
      target: 100, unit: '%',
      text: bestPace
        ? 'Schnellste Pace ' + pace(bestPace.paceSec) + ' pro km über ' + nf(bestPace.kmIst, 1) + ' km. Gefordert sind 6:15 über 10 km.'
        : 'Noch kein Lauf erfasst',
    },
  ];

  return {
    today: today, anchor: anchor, week: week, weekPlan: weekPlan, weekDays: weekDays,
    weekIst: weekIst, weekRunsPlanned: weekRunsPlanned.length, weekRunsDone: weekRunsDone,
    tend: tend, wgt: wgt, runs: runs,
    adherence: rated.length ? rated.filter(function (d) { return d.done; }).length / rated.length : null,
    ratedCount: rated.length, missed: missed, openPast: openPast,
    daysToRace: dayDiff(today, RACE_DAY), daysToGate: dayDiff(today, GATE_DAY),
    phaseKey: phaseKey, weekIndex: wIdx,
    gateProgress: gateProgress,
    phase: PHASES.filter(function (p) { return today >= p.from && today <= p.to; })[0] || PHASES[0],

}

/* Farbe für einen Sehnenwert aus der Severity-Rampe */

/* ========================================================================== */
/*  Physik: Feder, Momentum-Projektion, Gummiband                             */
/*  Werte nach Apples Parametrisierung (Dämpfung, Response).                  */
/* ========================================================================== */

function spring(opts) {
  var damping = opts.damping == null ? 1 : opts.damping;
  var response = opts.response == null ? 0.35 : opts.response;
  var x = opts.from, v = opts.velocity || 0, target = opts.to;
  var onUpdate = opts.onUpdate, onDone = opts.onDone;
  var omega = 2 * Math.PI / response;
  var raf = null, last = null, stopped = false;

  function frame(now) {
    if (stopped) return;
    if (last == null) last = now;
    var dt = Math.min(0.032, (now - last) / 1000);
    last = now;
    // halbimplizite Integration, stabil bei großen Schritten
    var a = -omega * omega * (x - target) - 2 * damping * omega * v;
    v += a * dt;
    x += v * dt;
    if (Math.abs(x - target) < 0.4 && Math.abs(v) < 6) {
      x = target; onUpdate(x);
      stopped = true;
      if (onDone) onDone();
      return;
    }
    onUpdate(x);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  return {
    stop: function () { stopped = true; if (raf) cancelAnimationFrame(raf); },
    retarget: function (t, vel) { target = t; if (vel != null) v = vel; },
    value: function () { return x; },
    velocity: function () { return v; },
  };
}

/** Apples Projektion aus „Designing Fluid Interfaces". v in px/s. */
function project(velocity, decelerationRate) {
  var d = decelerationRate == null ? 0.998 : decelerationRate;
  return (velocity / 1000) * d / (1 - d);

/** Weiches Anschlagen statt harter Wand. */

  var c = constant == null ? 0.55 : constant;
  return (overshoot * dimension * c) / (dimension + c * Math.abs(overshoot));
}

var reduceMotion = false;

/*  Bottom-Sheet                                                              */

};

/*  Diagramme                                                                 */

function frame(el, h, pad) {

  var p = Object.assign({ l: 2, r: 26, t: 12, b: 22 }, pad || {});
  return { w: w, h: h, x0: p.l, x1: w - p.r, y0: p.t, y1: h - p.b, iw: w - p.l - p.r, ih: h - p.t - p.b };
}
function ticks(min, max, n) {
  var span = (max - min) || 1, step0 = span / n;
  var mag = Math.pow(10, Math.floor(Math.log10(step0)));
  var step = [1, 2, 2.5, 5, 10].map(function (m) { return m * mag; }).filter(function (s) { return span / s <= n; })[0] || mag * 10;
  var out = [];
  for (var v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) out.push(Math.round(v * 1e6) / 1e6);
  return out;
}

    ' h' + (bw - 2 * r) + ' a' + r + ',' + r + ' 0 0 1 ' + r + ',' + r + ' v' + (h - r) + ' z';
}

/** Tooltip mit Fadenkreuz, Tasten-bedienbar. */

  if (!tip) { tip = document.createElement('div'); tip.className = 'tipb'; host.appendChild(tip); }
  var xh = svg.querySelector('.xh');
  function show(i) {
    var s = slots[i]; if (!s) return;
    tip.innerHTML = render(s.d, i);
    var w = host.clientWidth, half = tip.offsetWidth / 2 + 4;
    tip.style.left = clamp(s.x, half, w - half) + 'px';
    tip.style.top = Math.max(0, s.y - tip.offsetHeight - 14) + 'px';

  }

    show(best);

  svg.addEventListener('pointerleave', hide);

    h.setAttribute('tabindex', '0');
    h.addEventListener('focus', function () { show(i); });
    h.addEventListener('blur', hide);
  });
}

/* ---- Sehnenwerte als Balken ---- */

  s += '<g class="grid">';

    slots.push({ x: cx, y: top, d: d });

    else if (i % step === 0 && i < n - 1 - step * 0.7) s += '<text x="' + (f.x0 + slot * i + slot / 2) + '" y="' + (f.y1 + 15) + '" text-anchor="middle">' + dShort(d.date) + '</text>';

    return '<div class="h">' + esc(WD[toDate(d.date).getDay()]) + ' ' + dLong(d.date) + '</div>' +
      '<div class="r"><span>Morgenwert</span><b>' + nfa(d.v, 1) + '</b></div>' +

/* ---- Gewicht als Linie mit Wochenschnitt ---- */
function chartWeight(el, D) {
  var data = D.wgt.series;
  if (data.length < 2) { el.innerHTML = '<p class="note dim">Noch zu wenig Gewichtswerte für eine Linie.</p>'; return; }
  var f = frame(el, 170, { r: 34, b: 20 });

  s += '<path d="' + line + ' L' + pts[pts.length - 1][0].toFixed(1) + ',' + f.y1 + ' L' + pts[0][0].toFixed(1) + ',' + f.y1 + ' z" fill="var(--wine)" opacity="0.10"/>';
  var roll = data.map(function (d, i) { return { date: d.date, v: mean(data.slice(Math.max(0, i - 6), i + 1).map(function (q) { return q.v; })) }; });
  s += '<path d="' + roll.map(function (d, i) { return (i ? 'L' : 'M') + x(d.date).toFixed(1) + ',' + y(d.v).toFixed(1); }).join(' ') +
    '" fill="none" stroke="var(--ink-2)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.75"/>';
  s += '<path d="' + line + '" fill="none" stroke="var(--wine)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  var lastPt = pts[pts.length - 1];
  s += '<circle cx="' + lastPt[0] + '" cy="' + lastPt[1] + '" r="6" fill="#2A0E16"/><circle cx="' + lastPt[0] + '" cy="' + lastPt[1] + '" r="4" fill="var(--wine)"/>';
  s += '<text x="' + f.x0 + '" y="' + (f.y1 + 15) + '">' + dShort(data[0].date) + '</text>' +
    '<text class="strong" x="' + f.x1 + '" y="' + (f.y1 + 15) + '" text-anchor="end">' + dShort(data[data.length - 1].date) + '</text>';
  s += '<line class="xh" x1="0" x2="0" y1="' + f.y0 + '" y2="' + f.y1 + '"/>';
  var slots = data.map(function (d, i) { return { x: pts[i][0], y: pts[i][1], d: { date: d.date, v: d.v, roll: roll[i].v } }; });
  slots.forEach(function (sl, i) {
    var l = i ? (slots[i - 1].x + sl.x) / 2 : f.x0, r = i < slots.length - 1 ? (slots[i + 1].x + sl.x) / 2 : f.x1;
    s += '<rect class="hit" x="' + l + '" y="' + f.y0 + '" width="' + Math.max(1, r - l) + '" height="' + f.ih + '"/>';
  });
  s += '</svg>';
  el.innerHTML = s;
  attachTip(el, el.querySelector('svg'), slots, function (d) {
    return '<div class="h">' + dLong(d.date) + '</div>' +
      '<div class="r"><span>Morgens</span><b>' + nf(d.v, 2) + ' kg</b></div>' +
      '<div class="r"><span>7-Tage-Schnitt</span><b>' + nf(d.roll, 2) + ' kg</b></div>';
  });
}

/* ---- Kilometer pro Woche ---- */
function chartWeeks(el, D, model) {
  var weeks = model.weeks;
  var f = frame(el, 170, { r: 28, b: 22 });
  var n = weeks.length, slot = f.iw / n, bw = Math.min(18, Math.max(5, slot - 5));
  var maxV = Math.max.apply(null, weeks.map(function (w) { return w.kmSoll || 0; }).concat(Object.keys(D.runs.kmByWeek).map(function (k) { return D.runs.kmByWeek[k]; })));
  var yMax = maxV * 1.14;
  var y = function (v) { return f.y1 - (v / yMax) * f.ih; };
  var s = '<svg width="' + f.w + '" height="' + f.h + '" viewBox="0 0 ' + f.w + ' ' + f.h + '" role="img" aria-label="Kilometer pro Woche, Ist gegen Soll">';
  s += '<g class="grid">';
  ticks(0, yMax, 3).forEach(function (v) {
    s += '<line x1="' + f.x0 + '" x2="' + f.x1 + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (f.x1 + 5) + '" y="' + (y(v) + 3.5) + '">' + nf0(v) + '</text>';
  });
  s += '</g>';
  var slots = [];
  weeks.forEach(function (w, i) {
    var cx = f.x0 + slot * i + slot / 2, ist = D.runs.kmByWeek[w.week] || 0;
    if (w.week === D.week) s += '<rect x="' + (cx - slot / 2) + '" y="' + (f.y0 - 4) + '" width="' + slot + '" height="' + (f.ih + 4) + '" rx="5" fill="var(--wine)" opacity="0.08"/>';
    if (ist > 0) s += '<path d="' + roundedBarPath(cx, bw, y(ist), f.y1) + '" fill="var(--wine)"/>';
    if (w.kmSoll) s += '<line x1="' + (cx - bw / 2 - 2) + '" x2="' + (cx + bw / 2 + 2) + '" y1="' + y(w.kmSoll) + '" y2="' + y(w.kmSoll) + '" stroke="' + (ist > 0 ? 'var(--ink)' : 'var(--ink-2)') + '" stroke-width="2" stroke-linecap="round"/>';
    if (w.entlastung) s += '<circle cx="' + cx + '" cy="' + (f.y1 + 5) + '" r="1.5" fill="var(--ink-3)"/>';
    slots.push({ x: cx, y: y(Math.max(ist, w.kmSoll || 0)), d: Object.assign({ ist: ist }, w) });
  });
  var curIdx = weeks.map(function (w) { return w.week; }).indexOf(D.week);
  var show = ['B1', 'W01', 'W04', 'W08', 'W12', 'G5'].filter(function (k) {
    var i = weeks.map(function (w) { return w.week; }).indexOf(k);
    return i >= 0 && Math.abs(i - curIdx) > 1;
  });
  show.push(D.week);
  weeks.forEach(function (w, i) {
    if (show.indexOf(w.week) < 0) return;
    s += '<text' + (w.week === D.week ? ' class="strong"' : '') + ' x="' + (f.x0 + slot * i + slot / 2) + '" y="' + (f.y1 + 17) + '" text-anchor="middle">' + esc(w.week) + '</text>';
  });
  s += '<line class="xh" x1="0" x2="0" y1="' + f.y0 + '" y2="' + f.y1 + '"/>';
  weeks.forEach(function (w, i) { s += '<rect class="hit" x="' + (f.x0 + slot * i) + '" y="' + f.y0 + '" width="' + slot + '" height="' + f.ih + '"/>'; });
  s += '</svg>';
  el.innerHTML = s;
  attachTip(el, el.querySelector('svg'), slots, function (w) {
    return '<div class="h">' + esc(w.week) + ' ' + esc(w.datum) + '</div>' +
      '<div class="r"><span>' + esc(w.phase) + '</span></div>' +
      '<div class="r"><span>Ist</span><b>' + (w.ist ? nf(w.ist) + ' km' : '–') + '</b></div>' +
      '<div class="r"><span>Soll</span><b>' + nf(w.kmSoll) + ' km</b></div>' +
      '<div class="r"><span>Long Run</span><b>' + nf(w.lr) + ' km</b></div>';
  });
}

/* ---- Long-Run-Progression ---- */
function chartLongRun(el, D, model) {
  var weeks = model.weeks;
  var f = frame(el, 160, { r: 28, b: 22 });
  var n = weeks.length, slot = f.iw / n;
  var yMax = Math.max.apply(null, weeks.map(function (w) { return w.lr || 0; })) * 1.15;
  var y = function (v) { return f.y1 - (v / yMax) * f.ih; };
  var s = '<svg width="' + f.w + '" height="' + f.h + '" viewBox="0 0 ' + f.w + ' ' + f.h + '" role="img" aria-label="Long Run pro Woche">';
  s += '<g class="grid">';
  ticks(0, yMax, 3).forEach(function (v) {
    s += '<line x1="' + f.x0 + '" x2="' + f.x1 + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (f.x1 + 5) + '" y="' + (y(v) + 3.5) + '">' + nf0(v) + '</text>';
  });
  s += '</g>';
  var pts = weeks.map(function (w, i) { return [f.x0 + slot * i + slot / 2, y(w.lr || 0)]; });
  var d = '';
  pts.forEach(function (p, i) { d += (i ? ' L' + (p[0] - slot / 2) + ',' + p[1] : 'M' + (p[0] - slot / 2) + ',' + p[1]) + ' L' + (p[0] + slot / 2) + ',' + p[1]; });
  s += '<path d="' + d + '" fill="none" stroke="var(--ink-3)" stroke-width="1.5" stroke-linejoin="round"/>';
  var slots = [];
  weeks.forEach(function (w, i) {
    var cx = pts[i][0], done = model.runs.filter(function (r) { return r.week === w.week && /LONG RUN/i.test(r.typ) && r.done; })[0];
    if (done) {
      s += '<circle cx="' + cx + '" cy="' + y(done.kmIst) + '" r="6" fill="#2A0E16"/>';
      s += '<circle cx="' + cx + '" cy="' + y(done.kmIst) + '" r="3.8" fill="var(--wine)"/>';
    }
    slots.push({ x: cx, y: y(w.lr || 0), d: Object.assign({ done: done }, w) });
  });
  s += '<text x="' + f.x0 + '" y="' + (f.y1 + 17) + '">B1</text><text class="strong" x="' + f.x1 + '" y="' + (f.y1 + 17) + '" text-anchor="end">G5</text>';
  s += '<line class="xh" x1="0" x2="0" y1="' + f.y0 + '" y2="' + f.y1 + '"/>';
  weeks.forEach(function (w, i) { s += '<rect class="hit" x="' + (f.x0 + slot * i) + '" y="' + f.y0 + '" width="' + slot + '" height="' + f.ih + '"/>'; });
  s += '</svg>';
  el.innerHTML = s;
  attachTip(el, el.querySelector('svg'), slots, function (w) {
    return '<div class="h">' + esc(w.week) + ' ' + esc(w.datum) + '</div>' +
      '<div class="r"><span>Geplant</span><b>' + nf(w.lr) + ' km</b></div>' +
      (w.done ? '<div class="r"><span>Gelaufen</span><b>' + nf(w.done.kmIst, 2) + ' km</b></div>' : '') +
      (w.spike != null ? '<div class="r"><span>Sprung</span><b>' + (w.spike > 0 ? '+' : '') + nf(w.spike * 100, 1) + ' %</b></div>' : '');
  });
}

/* ---- Meter pro Herzschlag ---- */
function chartMhb(el, D) {
  var data = D.runs.mhbSeries;
  if (data.length < 2) { el.innerHTML = '<p class="note dim">Ab zwei erfassten Läufen zeigt die App hier den Verlauf.</p>'; return; }
  var f = frame(el, 130, { r: 34, b: 20 });
  var vals = data.map(function (r) { return r.mhb; });
  var lo = Math.min.apply(null, vals) - 0.05, hi = Math.max.apply(null, vals) + 0.05;
  var n = data.length;
  var x = function (i) { return f.x0 + (n > 1 ? (i / (n - 1)) * f.iw : f.iw / 2); };
  var y = function (v) { return f.y1 - ((v - lo) / (hi - lo)) * f.ih; };
  var s = '<svg width="' + f.w + '" height="' + f.h + '" viewBox="0 0 ' + f.w + ' ' + f.h + '" role="img" aria-label="Meter pro Herzschlag je Lauf">';
  s += '<g class="grid">';
  ticks(lo, hi, 2).forEach(function (v) {
    s += '<line x1="' + f.x0 + '" x2="' + f.x1 + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (f.x1 + 5) + '" y="' + (y(v) + 3.5) + '">' + nf(v, 2) + '</text>';
  });
  s += '</g>';
  var pts = data.map(function (r, i) { return [x(i), y(r.mhb)]; });
  s += '<path d="' + pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + '" fill="none" stroke="var(--wine)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function (p, i) {
    var hot = data[i].z3 != null && data[i].z3 >= 10;
    s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="5.5" fill="#2A0E16"/>';
    s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.4" fill="' + (hot ? 'var(--warn)' : 'var(--wine)') + '"/>';
  });
  s += '<text x="' + f.x0 + '" y="' + (f.y1 + 15) + '">' + dShort(data[0].date) + '</text>' +
    '<text class="strong" x="' + f.x1 + '" y="' + (f.y1 + 15) + '" text-anchor="end">' + dShort(data[n - 1].date) + '</text>';
  s += '<line class="xh" x1="0" x2="0" y1="' + f.y0 + '" y2="' + f.y1 + '"/>';
  var slots = data.map(function (r, i) { return { x: pts[i][0], y: pts[i][1], d: r }; });
  slots.forEach(function (sl, i) {
    var l = i ? (slots[i - 1].x + sl.x) / 2 : f.x0, r2 = i < n - 1 ? (slots[i + 1].x + sl.x) / 2 : f.x1;
    s += '<rect class="hit" x="' + l + '" y="' + f.y0 + '" width="' + Math.max(1, r2 - l) + '" height="' + f.ih + '"/>';
  });
  s += '</svg>';
  el.innerHTML = s;
  attachTip(el, el.querySelector('svg'), slots, function (r) {
    return '<div class="h">' + dShort(r.date) + ' ' + esc(r.typ) + '</div>' +
      '<div class="r"><span>Meter pro Schlag</span><b>' + nf(r.mhb, 2) + '</b></div>' +
      '<div class="r"><span>Pace</span><b>' + pace(r.paceSec) + ' /km</b></div>' +
      '<div class="r"><span>Ø Herzfrequenz</span><b>' + nf0(r.hf) + '</b></div>' +
      (r.z3 != null ? '<div class="r"><span>Zone 3+</span><b>' + nf0(r.z3) + ' %</b></div>' : '') +
      (r.temp != null ? '<div class="r"><span>Temperatur</span><b>' + nf0(r.temp) + ' °C</b></div>' : '');
  });
}

/* ---- Zone 3+ pro Lauf ---- */
function chartZones(el, D) {
  var data = D.runs.done.filter(function (r) { return r.z3 != null; });
  if (!data.length) { el.innerHTML = '<p class="note dim">Noch keine Zonen-Anteile erfasst.</p>'; return; }
  var f = frame(el, 140, { r: 26, b: 20 });
  var n = data.length, slot = f.iw / n, bw = Math.min(22, Math.max(6, slot - 6));
  var yMax = Math.max(20, Math.max.apply(null, data.map(function (r) { return r.z3; })) * 1.15);
  var y = function (v) { return f.y1 - (v / yMax) * f.ih; };
  var s = '<svg width="' + f.w + '" height="' + f.h + '" viewBox="0 0 ' + f.w + ' ' + f.h + '" role="img" aria-label="Anteil Zone 3 und höher pro Lauf">';
  s += '<g class="grid">';
  ticks(0, yMax, 3).forEach(function (v) {
    s += '<line x1="' + f.x0 + '" x2="' + f.x1 + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (f.x1 + 5) + '" y="' + (y(v) + 3.5) + '">' + nf0(v) + '</text>';
  });
  s += '</g>';
  s += '<line x1="' + f.x0 + '" x2="' + f.x1 + '" y1="' + y(10) + '" y2="' + y(10) +
    '" stroke="var(--warn)" stroke-width="1.5" opacity="0.55" shape-rendering="crispEdges"/>';
  var slots = [];
  data.forEach(function (r, i) {
    var cx = f.x0 + slot * i + slot / 2;
    s += '<path d="' + roundedBarPath(cx, bw, y(r.z3), f.y1) + '" fill="' + (r.z3 >= 10 ? 'var(--warn)' : 'var(--wine)') + '"/>';
    slots.push({ x: cx, y: y(r.z3), d: r });
  });
  s += '<text x="' + f.x0 + '" y="' + (f.y1 + 15) + '">' + dShort(data[0].date) + '</text>' +
    '<text class="strong" x="' + f.x1 + '" y="' + (f.y1 + 15) + '" text-anchor="end">' + dShort(data[n - 1].date) + '</text>';
  s += '<line class="xh" x1="0" x2="0" y1="' + f.y0 + '" y2="' + f.y1 + '"/>';
  data.forEach(function (r, i) { s += '<rect class="hit" x="' + (f.x0 + slot * i) + '" y="' + f.y0 + '" width="' + slot + '" height="' + f.ih + '"/>'; });
  s += '</svg>';
  el.innerHTML = s;
  attachTip(el, el.querySelector('svg'), slots, function (r) {
    return '<div class="h">' + dShort(r.date) + ' ' + esc(r.typ) + '</div>' +
      '<div class="r"><span>Zone 3+</span><b>' + nf0(r.z3) + ' %</b></div>' +
      '<div class="r"><span>Zone 2</span><b>' + nf0(r.z2) + ' %</b></div>' +
      '<div class="r"><span>Dauer</span><b>' + dur(r.sec) + '</b></div>';
  });
}

/* ---- Sparkline für Kacheln ---- */
function sparkline(values, tone) {
  if (!values || values.length < 2) return '';
  var w = 100, h = 22, lo = Math.min.apply(null, values), hi = Math.max.apply(null, values);
  var span = (hi - lo) || 1;
  var pts = values.map(function (v, i) { return [(i / (values.length - 1)) * w, h - 2 - ((v - lo) / span) * (h - 5)]; });
  var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
  var col = tone === 'warn' ? 'var(--warn)' : 'var(--wine)';
  var last = pts[pts.length - 1];
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" width="100%" height="22" aria-hidden="true">' +
    '<path d="' + d + ' L' + w + ',' + h + ' L0,' + h + ' z" fill="' + col + '" opacity="0.13"/>' +
    '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
    '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="2" fill="' + col + '"/></svg>';
}

/* ---- Ring für den Sehnenwert ---- */
function tendonRing(value, max) {
  var m = max || 10, r = 38, c = 2 * Math.PI * r;
  var frac = value == null ? 0 : clamp(value / m, 0, 1);
  return '<svg viewBox="0 0 92 92" role="img" aria-label="Morgenwert ' + (value == null ? 'nicht eingetragen' : nfa(value, 1) + ' von ' + m) + '">' +
    '<circle cx="46" cy="46" r="' + r + '" fill="none" stroke="rgba(0,0,0,0.32)" stroke-width="10"/>' +
    '<circle cx="46" cy="46" r="' + r + '" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="10"/>' +
    '<circle cx="46" cy="46" r="' + r + '" fill="none" stroke="' + sevColor(value) + '" stroke-width="10" stroke-linecap="round" ' +
    'stroke-dasharray="' + c + '" stroke-dashoffset="' + (c * (1 - frac)) + '" transform="rotate(-90 46 46)"/>' +
    '<text x="46" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#fff" style="font-variant-numeric:tabular-nums;letter-spacing:-0.03em">' +
    (value == null ? '–' : nfa(value, 1)) + '</text>' +
    '<text x="46" y="65" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgba(255,255,255,0.5)">von ' + m + '</text></svg>';
}

/** Segmentbalken 0 bis 10, wie die Glukose-Anzeige der Referenz. */
function segScale(value) {
  var out = '<div class="segbar" role="img" aria-label="Skala 0 bis 10, Wert ' + (value == null ? 'fehlt' : nfa(value, 1)) + '">';
  for (var i = 0; i <= 10; i++) {
    var on = value != null && i <= Math.round(value);
    out += '<i class="' + (on ? 'on' : '') + '"' + (on ? ' style="background:' + sevColor(i) + '"' : '') + '></i>';
  }
  return out + '</div><div class="segbar-legend"><span>0 nichts</span><span>5 abbrechen</span><span>10</span></div>';
}

/* ---- Spike-Anzeige ---- */
function spikeGauge(el, D) {
  var sp = D.runs.nextSpike;
  var next = D.runs.nextRun;
  var pct = sp == null ? null : sp * 100;
  var w = 100;
  var pos = pct == null ? 0 : clamp((pct + 10) / 40, 0, 1) * 100;
  var tone = pct == null ? '' : (pct < 10 ? 'good' : 'warn');
  el.innerHTML =
    '<div class="dl"><div><dt>Längster Lauf der letzten 30 Tage</dt><dd>' + (D.runs.max30 ? nf(D.runs.max30, 2) + ' km' : '–') + '</dd></div>' +
    (next ? '<div><dt>Nächster Lauf, geplant</dt><dd>' + nf(next.kmSoll, 1) + ' km</dd></div>' : '') +
    '<div><dt>Sprung</dt><dd>' + (pct == null ? '–' : (pct > 0 ? '+' : '') + nf(pct, 1) + ' %') + '</dd></div></div>' +
    '<div class="pbar ' + tone + '" style="margin-top:14px"><i style="width:' + pos + '%"></i></div>' +
    '<div class="segbar-legend"><span>−10 %</span><span>0</span><span>+10 %</span><span>+30 %</span></div>' +
    (pct != null && pct >= 10
      ? '<div class="banner" style="margin-top:12px">' + IC.warn + '<div>Der nächste geplante Lauf liegt ' + nf(pct, 1) + ' Prozent über dem 30-Tage-Maximum. Das ist die Zone mit 64 Prozent höherem Risiko.</div></div>'
      : '');
}

</script>
<script>
/* ============================================================================
   Athletic Training — Ansichten, Detail-Blätter, Eingabe-Formulare
   Aufbau nach den Referenz-Screenshots: Verlaufs-Hero mit Aktionsreihe,
   fette Sektionstitel außerhalb der Karten, 2x2-Kennzahlkacheln mit
   Icon-Chip, Listenzeilen mit führendem Kreis, schwebender Aktionsknopf.
   ========================================================================= */
'use strict';

var TABS = [
  { id: 'heute', label: 'Heute', icon: IC.today },
  { id: 'woche', label: 'Woche', icon: IC.week },
  { id: 'laufe', label: 'Läufe', icon: IC.run },
  { id: 'kraft', label: 'Kraft', icon: IC.kraft },
  { id: 'plan', label: 'Plan', icon: IC.gate },
];
var App = { tab: 'heute', D: null, scrollTop: 0 };

/* ------------------------------------------------------------- Bausteine -- */
function sec(title, more, action) {
  return '<div class="sec"><h2>' + esc(title) + '</h2>' +
    (more ? '<button class="more" type="button" ' + action + '>' + esc(more) + IC.chev + '</button>' : '') + '</div>';
}
function card(inner, extra) { return '<section class="card' + (extra ? ' ' + extra : '') + '">' + inner + '</section>'; }
function tapCard(inner, attrs) { return '<button class="card tap" type="button" ' + attrs + '>' + inner + '</button>'; }
function cardTop(title, meta) {
  return '<div class="card-top"><h3>' + esc(title) + '</h3>' + (meta ? '<div class="meta">' + meta + '</div>' : '') + '</div>';
}

/** Kennzahlkachel wie die Health-Statistics-Kacheln der Referenz. */
function stat(o) {
  return '<button class="stat' + (o.lg ? ' lg' : '') + '" type="button" data-info="' + esc(o.info || '') + '">' +
    '<span class="head"><span class="lbl">' + esc(o.label) + '</span>' +
    (o.icon ? '<span class="chip-ic' + (o.tone ? ' ' + o.tone : '') + '">' + o.icon + '</span>' : '') + '</span>' +
    '<span class="val num">' + o.value + (o.unit ? '<u>' + esc(o.unit) + '</u>' : '') + '</span>' +
    (o.delta ? '<span class="foot">' + o.delta + '</span>' : '') +
    (o.mini ? '<span class="mini">' + o.mini + '</span>' : '') +
    '</button>';
}
function lrow(o) {
  var tag = o.attrs ? 'button' : 'div';
  return '<' + tag + ' class="lrow' + (o.avatar ? ' inset' : '') + '"' + (o.attrs ? ' type="button" ' + o.attrs : '') + '>' +
    (o.avatar ? '<span class="av' + (o.avTone ? ' ' + o.avTone : '') + '">' + o.avatar + '</span>' : '') +
    '<span class="txt"><span class="t">' + esc(o.title) + '</span>' + (o.sub ? '<span class="s">' + esc(o.sub) + '</span>' : '') + '</span>' +
    (o.value ? '<span class="end"><span class="v">' + o.value + '</span>' + (o.valueSub ? '<span class="s">' + esc(o.valueSub) + '</span>' : '') + '</span>' : '') +
    (o.attrs ? '<span class="chev">' + IC.chev + '</span>' : '') +
    '</' + tag + '>';
}
function deltaChip(v, unit, lowerIsBetter, digits) {
  if (v == null || isNaN(v)) return '';
  var flat = Math.abs(v) < 0.045;
  var good = lowerIsBetter ? v < 0 : v > 0;
  return '<span class="delta ' + (flat ? '' : good ? 'good' : 'warn') + '">' +
    (flat ? '' : (v > 0 ? IC.up : IC.down)) +
    (flat ? '±0' : nf(Math.abs(v), digits == null ? 1 : digits)) + ' ' + esc(unit) + '</span>';
}
function pbar(pct, tone) {
  return '<div class="pbar' + (tone ? ' ' + tone : '') + '"><i style="width:' + clamp(pct, 0, 100) + '%"></i></div>';
}

/* ========================================================================== */
/*  Heute                                                                     */
/* ========================================================================== */
function viewHeute(D, m) {
  var h = '';
  var a = D.anchor, k = sessionKind(a.plan), isToday = a.date === D.today;

  /* Hero: Tage bis Wien, Phase, Aktionen */
  h += '<section class="hero">' +
    '<div class="lead">Bis zum Start in Wien</div>' +
    '<div class="big num">' + D.daysToRace + '<u>Tage</u></div>' +
    '<div class="pills">' +
    '<span class="pill2">' + esc(D.week) + ', ' + esc(D.weekPlan ? D.weekPlan.phase : '') + '</span>' +
    '<span class="pill2 q">Gate in ' + D.daysToGate + ' Tagen</span>' +
    '<span class="pill2 q">' + nf(D.weekIst) + ' von ' + nf(D.weekPlan ? D.weekPlan.kmSoll : null) + ' km</span>' +
    '</div>' +
    '<div class="acts">' +
    '<button class="act" type="button" data-form="daily" data-date="' + a.date + '">' + IC.plus + '<span>Tag<br>eintragen</span></button>' +
    '<button class="act" type="button" data-form="run" data-date="' + (D.runs.nextRun ? D.runs.nextRun.date : a.date) + '">' + IC.run + '<span>Lauf<br>erfassen</span></button>' +
    '<button class="act" type="button" data-tab="kraft">' + IC.kraft + '<span>Kraft<br>eintragen</span></button>' +
    '</div></section>';

  /* Heutige Einheit, Aufbau wie die Appointment-Karte der Referenz */
  h += sec(isToday ? 'Heute' : dLong(a.date), 'Woche', 'data-tab="woche"');
  h += card(
    '<div class="lrow inset" style="padding-top:0">' +
    '<span class="av wine">' + sessionIcon(k.key) + '</span>' +
    '<span class="txt"><span class="t">' + esc(k.label) + '</span><span class="s">' + esc(a.plan) + '</span></span>' +
    '</div>' +
    '<div class="ringwrap" style="margin-top:4px">' +
    '<button class="rng" type="button" data-info="sehnen" aria-label="Morgenwert im Detail">' + tendonRing(a.sehnen) + '</button>' +
    '<div style="flex:1;min-width:0">' +
    '<div class="pscale"><span>Sehnen früh</span><b>' + (a.sehnen == null ? 'fehlt' : nfa(a.sehnen, 1) + ' von 10') + '</b></div>' +
    segScale(a.sehnen) +
    '<div class="pills" style="margin-top:10px">' +
    (a.sehnen == null ? '<span class="pill2 q">' + IC.warn + 'Morgenwert fehlt</span>'
      : a.sehnen <= 2 ? '<span class="pill2 q">' + IC.ok + 'ruhig, weiter wie geplant</span>'
        : a.sehnen <= 4 ? '<span class="pill2 q">' + IC.warn + 'nicht steigern</span>'
          : '<span class="pill2 q">' + IC.warn + 'Stopp-Regel prüfen</span>') +
    (a.gewicht != null ? '<span class="pill2 q">' + nf(a.gewicht, 1) + ' kg</span>' : '') +
    (a.done === true ? '<span class="pill2 q">' + IC.ok + 'erledigt</span>' : a.done === false ? '<span class="pill2 q">' + IC.x + 'ausgefallen</span>' : '') +
    '</div></div></div>' +
    (a.notiz ? '<div class="quote" style="margin-top:14px">' + esc(a.notiz) + '</div>' : ''));

  /* Wochenstreifen */
  h += sec('Diese Woche', D.weekPlan ? D.weekPlan.datum : '', 'data-tab="woche"');
  h += card(weekStrip(D) +
    '<div class="pscale" style="margin-top:14px"><span>Kilometer</span><b>' + nf(D.weekIst) + ' von ' + nf(D.weekPlan ? D.weekPlan.kmSoll : null) + '</b></div>' +
    pbar(D.weekPlan && D.weekPlan.kmSoll ? D.weekIst / D.weekPlan.kmSoll * 100 : 0));

  /* Kennzahlen */
  var t = D.tend, w = D.wgt;
  h += sec('Kennzahlen', 'Alles im Plan', 'data-tab="plan"');
  h += '<div class="grid2">' +
    stat({
      label: 'Sehnen, 7 Tage', value: nf(t.mean7, 1), unit: 'von 10', info: 'sehnen',
      icon: IC.pulse, tone: t.mean7 != null && t.mean7 >= 3 ? 'amber' : '',
      delta: deltaChip(t.mean7 != null && t.meanPrev != null ? t.mean7 - t.meanPrev : null, 'zur Vorwoche', true),
      mini: sparkline(t.series.slice(-14).map(function (x) { return x.v; }), t.mean7 >= 3 ? 'warn' : ''),
    }) +
    stat({
      label: 'Gewicht, 7 Tage', value: nf(w.mean7, 1), unit: 'kg', info: 'gewicht', icon: IC.scale,
      delta: deltaChip(w.mean7 != null && w.meanPrev != null ? w.mean7 - w.meanPrev : null, 'kg', true, 2),
      mini: sparkline(w.series.slice(-14).map(function (x) { return x.v; })),
    }) +
    stat({
      label: 'Sprung, nächster Lauf', value: D.runs.nextSpike == null ? '–' : (D.runs.nextSpike > 0 ? '+' : '') + nf(D.runs.nextSpike * 100, 1), unit: '%',
      info: 'spike', icon: IC.spike, tone: D.runs.nextSpike != null && D.runs.nextSpike >= 0.1 ? 'amber' : '',
      delta: '<span class="delta' + (D.runs.nextSpike != null && D.runs.nextSpike >= 0.1 ? ' warn' : '') + '">Grenze 10 %</span>',
    }) +
    stat({
      label: 'Einheiten erledigt', value: D.adherence == null ? '–' : nf0(D.adherence * 100), unit: '%',
      info: 'adherence', icon: IC.ok, tone: D.adherence != null && D.adherence >= 0.9 ? 'green' : '',
      delta: '<span class="delta">' + D.ratedCount + ' bewertet</span>',
    }) +
    '</div>';

  /* Nachtragen */
  if (D.openPast.length) {
    h += sec(D.openPast.length === 1 ? 'Ein Tag ohne Eintrag' : D.openPast.length + ' Tage ohne Eintrag');
    h += card('<div class="list">' + D.openPast.slice(-3).map(function (d) {
      return lrow({
        avatar: sessionIcon(sessionKind(d.plan).key), avTone: 'amber',
        title: sessionKind(d.plan).label, sub: dLong(d.date) + ', ' + d.week,
        attrs: 'data-form="daily" data-date="' + d.date + '"',
      });
    }).join('') + '</div>');
  }

  return h;
}

function sessionIcon(key) {
  if (key === 'lr' || key === 'run1' || key === 'run2') return IC.run;
  if (key === 'race' || key === 'test') return IC.flag;
  if (key === 'kraftA' || key === 'kraftB' || key === 'kraftO') return IC.kraft;
  if (key === 'off' || key === 'buffer') return IC.moon;
  return IC.today;
}

function weekStrip(D) {
  return '<div class="wk">' + D.weekDays.map(function (d) {
    var isToday = d.date === D.today, past = d.date < D.today, k = sessionKind(d.plan);
    var st;
    if (d.done === true) st = '<span class="st ok">' + IC.check + '</span>';
    else if (d.done === false) st = '<span class="st miss">' + IC.x + '</span>';
    else if (k.key === 'off' || k.key === 'buffer') st = '<span class="st off"></span>';
    else if (isToday) st = '<span class="st now"></span>';
    else st = '<span class="st open"></span>';
    var km = planKm(d.plan);
    return '<button class="wkd' + (!past && !isToday ? ' future' : '') + '" type="button"' +
      (isToday ? ' aria-current="date"' : '') + ' data-form="daily" data-date="' + d.date + '"' +
      ' aria-label="' + esc(dLong(d.date) + ', ' + k.label) + '">' +
      '<span class="wd">' + esc(d.tag) + '</span>' +
      '<span class="dt num">' + (+d.date.slice(8)) + '</span>' +
      '<span class="sv">' + (d.sehnen != null ? nfa(d.sehnen, 1) : (km ? nfa(km, 1) : '')) + '</span>' +
      st + '</button>';
  }).join('') + '</div>';
}

/* ========================================================================== */
/*  Woche                                                                     */
/* ========================================================================== */
function viewWoche(D, m) {
  var wp = D.weekPlan, h = '';

  h += '<section class="hero">' +
    '<div class="lead">' + esc(D.week) + (wp ? ', ' + esc(wp.datum) : '') + '</div>' +
    '<div class="big num">' + nf(D.weekIst) + '<u>von ' + nf(wp ? wp.kmSoll : null) + ' km</u></div>' +
    '<div class="pills">' +
    '<span class="pill2">' + esc(wp ? wp.phase : 'Woche') + '</span>' +
    '<span class="pill2 q">' + D.weekRunsDone + ' von ' + D.weekRunsPlanned + ' Läufen</span>' +
    (wp && wp.entlastung ? '<span class="pill2 q">' + IC.warn + 'Entlastungswoche</span>' : '') +
    '</div>' +
    '<div class="acts" style="grid-template-columns:repeat(2,minmax(0,1fr))">' +
    '<button class="act" type="button" data-form="weekly" data-week="' + esc(D.week) + '">' + IC.pulse + '<span>Wochenwerte</span></button>' +
    '<button class="act" type="button" data-info="wochenstruktur">' + IC.book + '<span>Wochenstruktur</span></button>' +
    '</div></section>';

  h += sec('Kilometer');
  h += card(
    '<div class="pscale"><span>Ist</span><b>' + nf(D.weekIst) + ' von ' + nf(wp ? wp.kmSoll : null) + ' km</b></div>' +
    pbar(wp && wp.kmSoll ? D.weekIst / wp.kmSoll * 100 : 0) +
    '<div class="dl" style="margin-top:14px">' +
    (wp ? '<div><dt>Long Run am Sonntag</dt><dd>' + nf(wp.lr) + ' km</dd></div>' : '') +
    (wp && wp.spike != null ? '<div><dt>Sprung des Long Runs</dt><dd' + (wp.spike >= 0.1 ? ' style="color:var(--warn)"' : '') + '>' + (wp.spike > 0 ? '+' : '') + nf(wp.spike * 100, 1) + ' %</dd></div>' : '') +
    (wp && wp.sehnenMax != null ? '<div><dt>Höchster Morgenwert</dt><dd>' + nfa(wp.sehnenMax, 1) + '</dd></div>' : '') +
    (wp && wp.trend != null ? '<div><dt>Trend zur Vorwoche</dt><dd' + (wp.trend > 0 ? ' style="color:var(--warn)"' : '') + '>' + (wp.trend > 0 ? '+' : '') + nfa(wp.trend, 1) + '</dd></div>' : '') +
    '</div>' +
    (wp && wp.zusatz ? '<div class="quote" style="margin-top:14px">' + esc(wp.zusatz) + '</div>' : ''));

  h += sec('Tage');
  h += card('<div class="list">' + D.weekDays.map(function (d) {
    var k = sessionKind(d.plan), isToday = d.date === D.today;
    var run = m.runs.filter(function (r) { return r.date === d.date && r.done; })[0];
    var tone = d.done === true ? 'wine' : d.done === false ? 'amber' : '';
    return lrow({
      avatar: '<span>' + (+d.date.slice(8)) + '</span>', avTone: tone,
      title: k.label,
      sub: d.tag + (isToday ? ', heute' : '') + ', ' + (run ? nf(run.kmIst, 2) + ' km, ' + pace(run.paceSec) + ' pro km' : d.plan.slice(0, 46)),
      value: d.sehnen != null ? '<span style="color:' + sevColor(d.sehnen) + '">' + nfa(d.sehnen, 1) + '</span>' : '',
      valueSub: d.sehnen != null ? 'Sehnen' : '',
      attrs: 'data-form="daily" data-date="' + d.date + '"',
    });
  }).join('') + '</div>');

  var wv = m.weekly.filter(function (x) { return x.week === D.week; })[0];
  h += sec('Wochenwerte', 'Eintragen', 'data-form="weekly" data-week="' + esc(D.week) + '"');
  h += '<div class="grid3">' +
    stat({ label: 'Gewicht Ø', value: nf(wv ? wv.gewicht : null, 1), unit: 'kg', info: 'gewicht' }) +
    stat({ label: 'Ruhepuls Ø', value: nf0(wv ? wv.ruhepuls : null), unit: 'bpm', info: '' }) +
    stat({ label: 'Schlaf Ø', value: nf(wv ? wv.schlaf : null, 1), unit: 'h', info: '' }) +
    '</div>';
  h += card('<p class="note dim">Gewicht Ø rechnet die Tabelle selbst aus dem Tagesprotokoll. Ruhepuls, Herzfrequenzvariabilität und Schlaf trägst du als Wochenmittel ein, nie als Tageswert.</p>');

  h += sec('Verlauf', 'Alle Wochen', 'data-info="spike"');
  h += card(cardTop('Kilometer pro Woche', 'Ist als Balken, Soll als Strich') +
    '<div class="chart" id="chWeeks"></div>' +
    '<div class="legend"><span><i style="background:var(--wine)"></i>Ist</span><span><i class="line" style="background:var(--ink-2)"></i>Soll</span><span><i class="dot" style="width:5px;height:5px;background:var(--ink-3)"></i>Entlastung</span></div>');
  return h;
}

  var last = R.done[R.done.length - 1];

  h += '<section class="hero">' +

    '<span class="pill2">' + R.done.length + ' Läufe</span>' +
    '<span class="pill2 q">längster ' + (R.longest ? nf(R.longest.kmIst, 2) + ' km' : '–') + '</span>' +
    '<span class="pill2 q">schnellste ' + (R.bestPace ? pace(R.bestPace.paceSec) + ' pro km' : '–') + '</span>' +
    '</div>' +
    (last ? '<div class="acts" style="grid-template-columns:repeat(2,minmax(0,1fr))">' +
      '<button class="act" type="button" data-form="run" data-date="' + (R.nextRun ? R.nextRun.date : last.date) + '">' + IC.plus + '<span>Lauf erfassen</span></button>' +
      '<button class="act" type="button" data-info="spike">' + IC.spike + '<span>Sprung-Regel</span></button>' +
      '</div>' : '') +
    '</section>';

  h += sec('Kennzahlen');
  h += '<div class="grid2">' +
    stat({
      label: 'Meter pro Herzschlag', value: R.mhbSeries.length ? nf(R.mhbSeries[R.mhbSeries.length - 1].mhb, 2) : '–',
      info: 'mhb', icon: IC.pulse, mini: sparkline(R.mhbSeries.map(function (r) { return r.mhb; })),
      delta: R.mhbSeries.length > 1 ? deltaChip(R.mhbSeries[R.mhbSeries.length - 1].mhb - R.mhbSeries[R.mhbSeries.length - 2].mhb, 'zum Lauf davor', false, 2) : '',
    }) +
    stat({
      label: 'Zone 3 und höher', value: nf(R.z3recent, 0), unit: '%', info: 'zonen', icon: IC.spike,
      tone: R.z3recent != null && R.z3recent >= 10 ? 'amber' : 'green',
      delta: '<span class="delta' + (R.z3recent != null && R.z3recent >= 10 ? ' warn' : '') + '">letzte drei, unter 10 %</span>',
    }) +
    '</div>';

  h += sec('Volumen');
  h += card(cardTop('Kilometer pro Woche', 'Ist gegen Soll') + '<div class="chart" id="chWeeks2"></div>' +
    '<div class="legend"><span><i style="background:var(--wine)"></i>Ist</span><span><i class="line" style="background:var(--ink-2)"></i>Soll</span></div>');

  h += sec('Effizienz', 'Was das heißt', 'data-info="mhb"');
  h += tapCard(cardTop('Meter pro Herzschlag', R.mhbSeries.length ? nf(R.mhbSeries[R.mhbSeries.length - 1].mhb, 2) + ' zuletzt' : '') +
    '<div class="chart" id="chMhb"></div>' +
    '<div class="legend"><span><i class="dot" style="background:var(--wine)"></i>Lauf</span><span><i class="dot" style="background:var(--warn)"></i>Zone 3+ über 10 %</span></div>',
    'data-info="mhb"');

  h += sec('Disziplin', 'Warum Zone 3', 'data-info="zonen"');
  h += tapCard(cardTop('Zone 3 und höher', R.z3recent != null ? nf0(R.z3recent) + ' % im Schnitt' : '') +
    '<div class="chart" id="chZones"></div>' +
    '<div class="legend"><span><i style="background:var(--wine)"></i>unter 10 %</span><span><i style="background:var(--warn)"></i>über 10 %</span><span><i class="line" style="background:rgba(255,255,255,.35)"></i>Richtwert</span></div>',
    'data-info="zonen"');

  var rows = m.runs.slice().reverse().filter(function (r) { return r.done || r.date >= D.today; }).slice(0, 40);
  h += sec('Alle Läufe', m.runs.filter(function (r) { return !r.done; }).length + ' offen');
  h += card('<div class="list">' + rows.map(function (r) {
    return lrow({
      avatar: r.done ? IC.check : IC.run, avTone: r.done ? 'wine' : '',
      title: r.typ,
      sub: dLong(r.date) + ', ' + r.week + (r.done ? ', ' + nf(r.kmIst, 2) + ' km' : ', Soll ' + nf(r.kmSoll, 1) + ' km'),
      value: r.done ? (r.paceSec ? pace(r.paceSec) : nf(r.kmIst, 1)) : '',
      valueSub: r.done ? (r.paceSec ? 'pro km' : 'km') : 'offen',
      attrs: 'data-form="run" data-date="' + r.date + '"',
    });
  }).join('') + '</div>');
  return h;
}

/* ========================================================================== */
/*  Kraft                                                                     */
/* ========================================================================== */
var kraftBlock = 'A';
function viewKraft(D, m) {
  var K = m.kraft[kraftBlock];
  var cols = K.columns.map(function (c) { return c.week; });
  var targetWeek = D.week;
  var done = 0;
  K.exercises.forEach(function (ex) { if (exSummary(ex, cols, targetWeek).current) done++; });

  var h = '';
  h += '<section class="hero">' +
    '<div class="lead">' + (kraftBlock === 'A' ? 'Kraft A, Ganzkörper schwer' : 'Kraft B, Volumen und Core') + '</div>' +
    '<div class="big num">' + done + '<u>von ' + K.exercises.length + '</u></div>' +
    '<div class="pills">' +
    '<span class="pill2">Woche ' + esc(targetWeek) + '</span>' +
    (D.weekPlan && D.weekPlan.entlastung ? '<span class="pill2 q">' + IC.warn + 'ein Satz weniger, 80 Prozent</span>' : '<span class="pill2 q">Double Progression</span>') +
    '</div>' +
    '<div class="acts" style="grid-template-columns:repeat(2,minmax(0,1fr))">' +
    '<button class="act" type="button" data-info="kraftlogik">' + IC.book + '<span>Warum Kraft</span></button>' +
    '<button class="act" type="button" data-info="sehnenblock">' + IC.pulse + '<span>Sehnen-Block</span></button>' +
    '</div></section>';

  h += '<div class="sec"><h2>Übungen</h2>' +
    '<div class="seg" role="tablist">' +
    '<button role="tab" type="button" aria-selected="' + (kraftBlock === 'A') + '" data-kblock="A">Kraft A</button>' +
    '<button role="tab" type="button" aria-selected="' + (kraftBlock === 'B') + '" data-kblock="B">Kraft B</button>' +
    '</div></div>';

  h += card('<div class="list">' + K.exercises.map(function (ex, i) {
    var s = exSummary(ex, cols, targetWeek);
    return lrow({
      avatar: s.current ? IC.check : IC.kraft, avTone: s.current ? 'wine' : '',
      title: ex.name,
      sub: 'Ziel ' + ex.zielReps + ' Wdh, RIR ' + ex.rir + (s.lastWeek ? ', ' + s.lastWeek + ': ' + s.lastLabel : ''),
      value: s.current ? esc(s.currentWeight || 'BW') : (s.lastWeight ? '<span style="color:var(--ink-3)">' + esc(s.lastWeight) + '</span>' : ''),
      valueSub: s.current ? targetWeek : (s.lastWeight ? targetWeek + ' offen' : 'offen'),
      attrs: 'data-form="strength" data-block="' + kraftBlock + '" data-ex="' + i + '" data-week="' + esc(targetWeek) + '"',
    });
  }).join('') + '</div>' +
    '<p class="note dim" style="margin-top:12px">Notation wie im Sheet: Wiederholungen(RIR) und Gewicht, zum Beispiel 5(2) und 110kg. Erst alle Sätze am oberen Rep-Ende, dann Gewicht rauf.</p>');

  var phase = m.sehnen.phases.filter(function (p) { return p.key === D.phaseKey; })[0] || m.sehnen.phases[0];
  h += sec('Sehnen-Block', 'Alle Phasen', 'data-info="sehnenblock"');
  h += tapCard(cardTop(phase ? phase.key + ', ' + phase.hint : 'Sehnen-Block', 'dreimal pro Woche') +
    '<div class="list">' + (phase ? phase.items : []).map(function (it) {
      return lrow({ title: it.uebung, sub: it.ziel, value: esc(it.dosis), valueSub: it.tempo });
    }).join('') + '</div>', 'data-info="sehnenblock"');
  return h;
}

function exSummary(ex, cols, targetWeek) {
  var filled = cols.filter(function (w) { return ex.sets.some(function (s) { return s.sessions[w]; }); });
  var current = filled.indexOf(targetWeek) >= 0 ? targetWeek : null;
  var prior = filled.filter(function (w) { return w !== targetWeek && cols.indexOf(w) < cols.indexOf(targetWeek); });
  var lastWeek = prior.length ? prior[prior.length - 1] : (filled.length ? filled[filled.length - 1] : null);
  function pick(w) { return w ? ex.sets.map(function (s) { return s.sessions[w]; }).filter(Boolean) : []; }
  var cur = pick(current), lst = pick(lastWeek);
  function weightOf(arr) {
    var ws = arr.map(function (q) { return q.weight; }).filter(Boolean);
    return ws.length ? ws.filter(function (v, i, s) { return s.indexOf(v) === i; }).join(' / ') : (arr.length ? 'BW' : '');
  }
  return {
    current: cur.length ? cur : null, currentWeight: weightOf(cur),
    lastWeek: lastWeek, lastWeight: weightOf(lst),
    lastLabel: lst.map(function (q) { return q.repsLabel; }).join(' '),
    filled: filled,
  };
}

/*  Plan                                                                      */
