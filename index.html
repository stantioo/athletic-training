<style>
/* ============================================================================
   Athletic Training — Design-System

   Grund: tiefer Weinverlauf. Inhalt: wenige Glasflächen, viel ruhige Fläche.
   Regeln gegen den generierten Look:
     - keine farbigen Kanten links an Hinweisblöcken
     - keine Kästen um einzelne Absätze, Text steht frei
     - ein Panel nur, wo es eine Gruppe zusammenhält (Hero, Kacheln, Listen)
     - Symbole aus einem Satz (Phosphor), Tab-Leiste nur Symbole, aktiv gefüllt
     - Abstände aus einer 4er-Skala, Pillen eng gesetzt
   Bedienelemente in iOS-Maßen: Schalter 51x31, Ziele mindestens 44, Menü 44er Zeilen.
   ========================================================================= */

:root {
  color-scheme: dark;

  --bg:       #140508;
  --bg-top:   #2E0E19;
  --bg-mid:   #1A070F;
  --bg-deep:  #0C0305;

  --glass:      rgba(255, 255, 255, 0.07);
  --glass-2:    rgba(255, 255, 255, 0.045);
  --glass-str:  rgba(255, 255, 255, 0.11);
  --edge:       rgba(255, 255, 255, 0.10);
  --edge-soft:  rgba(255, 255, 255, 0.065);
  --edge-str:   rgba(255, 255, 255, 0.18);
  --sep:        rgba(255, 255, 255, 0.085);

  --ink:    #FFFFFF;
  --ink-2:  rgba(255, 255, 255, 0.66);
  --ink-3:  rgba(255, 255, 255, 0.42);

  --wine:      #C8354A;
  --wine-deep: #7A1526;
  --wine-hi:   #F0808F;
  --wine-dim:  rgba(200, 53, 74, 0.18);
  --wine-line: rgba(200, 53, 74, 0.42);

  --good:  #4ECB8E;
  --warn:  #F2B33D;
  --bad:   #FF6B6B;
  --good-dim: rgba(78, 203, 142, 0.15);
  --warn-dim: rgba(242, 179, 61, 0.15);

  --sev-0: #6F5222; --sev-1: #906A28; --sev-2: #B18334;
  --sev-3: #CF9A3D; --sev-4: #EAAF49; --sev-5: #FFC455;

  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;

  --gutter: 16px;
  --col: 640px;

  --r-card: 22px;
  --r-tile: 18px;
  --r-inner: 13px;
  --r-ctl: 11px;
  --r-sheet: 26px;

  --ease-out:    cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --d-press: 140ms;
  --d-fast:  180ms;
  --d-ui:    240ms;

  --tab-h: 49px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

/* ---------- Reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; height: 100%; }
body {
  margin: 0; height: 100%;
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; overscroll-behavior: none;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: var(--wine-hi); text-decoration: none; }
h1, h2, h3, p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
[hidden] { display: none !important; }
svg:not([width]) { width: 1em; height: 1em; flex-shrink: 0; vertical-align: -0.13em; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--wine-hi); outline-offset: 2px; border-radius: 8px; }

/* ============================================================================
   Rahmen: fest an den Bildschirm geheftet, nur der Inhalt scrollt
   ========================================================================= */
.app {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; overflow: hidden;
  background:
    radial-gradient(118% 54% at 50% -16%, var(--bg-top) 0%, var(--bg-mid) 44%, var(--bg-deep) 100%),
    var(--bg);
}
.app::before {
  content: ''; position: absolute; inset: -6% -18% auto auto;
  width: 72%; max-width: 440px; aspect-ratio: 1;
  background: radial-gradient(closest-side, rgba(240, 128, 143, 0.11), transparent 70%);
  pointer-events: none; z-index: 0;
}

/* ---------- Kopf ---------- */
.nav {
  position: relative; z-index: 3; flex-shrink: 0;
  padding: calc(var(--safe-t) + 10px) var(--gutter) 10px;
  border-bottom: 1px solid transparent;
  transition: background var(--d-ui) var(--ease-out), border-color var(--d-ui) var(--ease-out);
}
.app.scrolled .nav {
  background: rgba(22, 6, 11, 0.6);
  backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%);
  border-bottom-color: var(--edge-soft);
}
.nav-inner { max-width: var(--col); margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.nav-titles { flex: 1; min-width: 0; }
.nav-titles h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.028em; line-height: 1.1; transition: font-size var(--d-ui) var(--ease-out); }
.nav-titles .sub {
  color: var(--ink-2); font-size: 13px; margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  max-height: 20px; opacity: 1;
  transition: max-height var(--d-ui) var(--ease-out), opacity var(--d-ui) var(--ease-out);
}
.app.scrolled .nav-titles h1 { font-size: 20px; }
.app.scrolled .nav-titles .sub { max-height: 0; opacity: 0; }
.nav-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; position: relative; }

.iconbtn {
  width: 40px; height: 40px; flex-shrink: 0; position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%; background: var(--glass); border: 1px solid var(--edge);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  color: var(--ink);
  transition: transform var(--d-press) var(--ease-out), background var(--d-fast) var(--ease-out);
}
.iconbtn:active { transform: scale(0.9); background: var(--glass-str); }
.iconbtn svg { width: 19px; height: 19px; }
.iconbtn .dot { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid #200910; }
.iconbtn[data-state="live"] .dot { background: var(--good); }
.iconbtn[data-state="warn"] .dot { background: var(--warn); }
.iconbtn[data-state="busy"] .dot { background: var(--ink-2); animation: blink 1.1s ease-in-out infinite; }
.iconbtn[data-state="snap"] .dot { display: none; }
@keyframes blink { 50% { opacity: 0.28; } }
.iconbtn.spin svg { animation: spin 900ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Scrollbereich ---------- */
.scroll { position: relative; z-index: 1; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.scroll::-webkit-scrollbar { width: 0; height: 0; }
.view {
  max-width: var(--col); margin: 0 auto;
  padding: 6px var(--gutter) 28px;
  display: flex; flex-direction: column; gap: 12px;
  animation: viewIn 220ms var(--ease-out);
}
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Tab-Leiste: nur Symbole, aktiv gefüllt ---------- */
.tabbar {
  position: relative; z-index: 4; flex-shrink: 0;
  padding: 0 0 var(--safe-b);
  background: rgba(20, 5, 9, 0.72);
  backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
  border-top: 1px solid var(--sep);
}
.tabbar-inner { max-width: var(--col); margin: 0 auto; height: var(--tab-h); display: grid; grid-template-columns: repeat(5, 1fr); }
.tab {
  height: var(--tab-h); display: flex; align-items: center; justify-content: center;
  color: rgba(255, 255, 255, 0.55);
  transition: color var(--d-fast) var(--ease-out), transform var(--d-press) var(--ease-out);
}
.tab:active { transform: scale(0.88); }
.tab svg { width: 27px; height: 27px; }
.tab .on { display: none; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"] .off { display: none; }
.tab[aria-selected="true"] .on { display: block; }

/* ============================================================================
   Sektionstitel außerhalb der Flächen
   ========================================================================= */
.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 10px 2px -4px; }
.sec h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.022em; }
.sec .more { font-size: 14px; font-weight: 600; color: var(--wine-hi); white-space: nowrap; display: inline-flex; align-items: center; gap: 2px; }
.sec .more svg { width: 13px; height: 13px; }

/* ============================================================================
   Flächen
   ========================================================================= */
.card {
  position: relative; border-radius: var(--r-card);
  background: var(--glass);
  backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%);
  border: 1px solid var(--edge);
  padding: 16px; overflow: hidden; min-width: 0;
}
.card.tap { text-align: left; width: 100%; display: block; transition: transform var(--d-press) var(--ease-out); }
.card.tap:active { transform: scale(0.985); }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.card-top h3 { font-size: 16px; font-weight: 600; letter-spacing: -0.012em; }
.card-top .meta { color: var(--ink-3); font-size: 12.5px; text-align: right; flex-shrink: 0; padding-top: 2px; font-variant-numeric: tabular-nums; }
.hr { height: 1px; background: var(--sep); border: 0; margin: 14px 0; }

.chip-ic {
  width: 30px; height: 30px; flex-shrink: 0; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: var(--wine-dim); color: var(--wine-hi);
}
.chip-ic svg { width: 17px; height: 17px; }
.chip-ic.amber { background: var(--warn-dim); color: var(--warn); }
.chip-ic.green { background: var(--good-dim); color: var(--good); }

/* ============================================================================
   Hero
   ========================================================================= */
.hero {
  border-radius: var(--r-card); padding: 18px 18px 16px;
  background: linear-gradient(158deg, #C8354A 0%, #9E2337 46%, #6B1223 100%);
  border: 1px solid rgba(255, 255, 255, 0.17);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.22) inset, 0 14px 36px rgba(107, 18, 35, 0.42);
  overflow: hidden; position: relative;
}
.hero::after {
  content: ''; position: absolute; inset: -60% -30% auto auto; width: 70%; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255, 255, 255, 0.15), transparent 70%); pointer-events: none;
}
.hero .lead { font-size: 13.5px; color: rgba(255, 255, 255, 0.74); font-weight: 500; }
.hero .big { font-size: 50px; line-height: 1; font-weight: 700; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; margin-top: 3px; }
.hero .big u { font-style: normal; text-decoration: none; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; color: rgba(255, 255, 255, 0.66); margin-left: 7px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.pill2 {
  display: inline-flex; align-items: center; gap: 5px;
  height: 28px; padding: 0 11px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.18);
  font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.pill2 svg { width: 13px; height: 13px; }
.pill2.q { background: rgba(0, 0, 0, 0.2); border-color: rgba(255, 255, 255, 0.14); font-weight: 500; color: rgba(255, 255, 255, 0.86); }
.acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.acts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.act {
  min-height: 58px; padding: 8px 4px; border-radius: var(--r-inner);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  background: rgba(0, 0, 0, 0.22); border: 1px solid rgba(255, 255, 255, 0.16); color: #fff;
  transition: transform var(--d-press) var(--ease-out), background var(--d-fast) var(--ease-out);
}
.act:active { transform: scale(0.95); background: rgba(0, 0, 0, 0.34); }
.act svg { width: 20px; height: 20px; }
.act span { font-size: 12px; font-weight: 600; text-align: center; line-height: 1.2; }

/* ============================================================================
   Kacheln
   ========================================================================= */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat {
  border-radius: var(--r-tile); padding: 12px;
  background: var(--glass); border: 1px solid var(--edge);
  backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%);
  text-align: left; width: 100%; min-width: 0; display: flex; flex-direction: column;
  transition: transform var(--d-press) var(--ease-out), background var(--d-fast) var(--ease-out);
}
.stat:active { transform: scale(0.97); background: var(--glass-str); }
.stat .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.stat .lbl { font-size: 13px; font-weight: 600; letter-spacing: -0.006em; line-height: 1.25; color: var(--ink-2); }
.stat .val { font-size: 26px; font-weight: 700; letter-spacing: -0.028em; line-height: 1.05; font-variant-numeric: tabular-nums; margin-top: 10px; }
.stat .val u { font-style: normal; text-decoration: none; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-left: 4px; letter-spacing: 0; }
.stat .mini { margin-top: 8px; height: 28px; }
.stat .foot { margin-top: 5px; }
.delta { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.delta.good { color: var(--good); }
.delta.warn { color: var(--warn); }
.delta svg { width: 11px; height: 11px; }

/* ============================================================================
   Fortschritt
   ========================================================================= */
.pscale { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; margin-bottom: 6px; }
.pscale b { color: var(--ink); font-weight: 700; font-size: 13px; }
.pbar { position: relative; height: 8px; border-radius: 5px; background: rgba(0, 0, 0, 0.3); overflow: hidden; }
.pbar i { position: absolute; inset: 0; width: 0; border-radius: 5px; background: linear-gradient(90deg, var(--wine-deep), var(--wine) 70%, var(--wine-hi)); transition: width 420ms var(--ease-out); }
.pbar.warn i { background: linear-gradient(90deg, #9A6F22, var(--warn)); }
.pbar.good i { background: linear-gradient(90deg, #1F7A52, var(--good)); }
.segbar { display: flex; gap: 3px; align-items: flex-end; height: 24px; }
.segbar i { flex: 1; border-radius: 3px; background: rgba(255, 255, 255, 0.1); height: 60%; }
.segbar i.on { height: 100%; }
.segbar-legend { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-3); margin-top: 5px; font-variant-numeric: tabular-nums; }
.ringwrap { display: flex; align-items: center; gap: 14px; }
.ringwrap > .rng { width: 88px; height: 88px; flex-shrink: 0; }
.ringwrap > .rng svg { width: 88px; height: 88px; display: block; }

/* ============================================================================
   Listen, Trenner ab dem Text eingerückt
   ========================================================================= */
.list { display: flex; flex-direction: column; }
.lrow { position: relative; display: flex; align-items: center; gap: 12px; padding: 11px 0; width: 100%; text-align: left; transition: background var(--d-fast) var(--ease-out); }
.lrow + .lrow::before { content: ''; position: absolute; top: 0; right: 0; left: 0; height: 1px; background: var(--sep); }
.lrow.inset + .lrow.inset::before { left: 48px; }
.lrow:active { background: rgba(255, 255, 255, 0.04); }
.av {
  width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--glass-str); font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.av svg { width: 18px; height: 18px; }
.av.wine { background: var(--wine-dim); color: var(--wine-hi); }
.av.amber { background: var(--warn-dim); color: var(--warn); }
.av.green { background: var(--good-dim); color: var(--good); }
.lrow .txt { flex: 1; min-width: 0; }
.lrow .txt .t { display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .txt .s { display: block; font-size: 12.5px; color: var(--ink-2); margin-top: 1px; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .end { flex-shrink: 0; text-align: right; max-width: 44%; }
.lrow .end .v { display: block; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -0.012em; }
.lrow .end .s { display: block; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; margin-top: 1px; }
.chev { color: var(--ink-3); flex-shrink: 0; display: inline-flex; }
.chev svg { width: 14px; height: 14px; }

.dl { display: flex; flex-direction: column; }
.dl > div { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; position: relative; }
.dl > div + div::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--sep); }
.dl dt { color: var(--ink-2); font-size: 14px; }
.dl dd { margin: 0; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.dl.stack > div { flex-direction: column; gap: 2px; }
.dl.stack dt { color: var(--ink); font-weight: 600; }
.dl.stack dd { text-align: left; font-weight: 400; color: var(--ink-2); font-size: 13.5px; line-height: 1.45; }

/* ============================================================================
   Wochenstreifen
   ========================================================================= */
.wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wkd {
  position: relative; border-radius: 12px; padding: 8px 2px 7px;
  background: var(--glass-2); border: 1px solid var(--edge-soft);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  transition: transform var(--d-press) var(--ease-out);
}
.wkd:active { transform: scale(0.93); }
.wkd[aria-current="date"] { border-color: rgba(240, 128, 143, 0.5); background: var(--wine-dim); }
.wkd.future { opacity: 0.45; }
.wkd .wd { font-size: 10px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-3); }
.wkd[aria-current="date"] .wd { color: var(--wine-hi); }
.wkd .dt { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.wkd .st { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: 3px; }
.wkd .st svg { width: 11px; height: 11px; }
.wkd .st.ok { background: var(--wine); color: #fff; }
.wkd .st.miss { background: var(--warn-dim); color: var(--warn); }
.wkd .st.sick { background: var(--glass-str); color: var(--ink-2); }
.wkd .st.open { border: 1.5px solid var(--edge-str); }
.wkd .st.now { border: 1.5px solid var(--wine-hi); }
.wkd .st.off { width: 5px; height: 5px; background: var(--ink-3); margin-top: 9px; }
.wkd .sv { font-size: 9.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; min-height: 12px; }

/* ============================================================================
   Bedienelemente
   ========================================================================= */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 48px; padding: 0 18px; border-radius: var(--r-ctl);
  font-size: 16px; font-weight: 600; letter-spacing: -0.008em;
  background: var(--glass-str); color: var(--ink); border: 1px solid var(--edge);
  transition: transform var(--d-press) var(--ease-out), background var(--d-fast) var(--ease-out);
}
.btn:active { transform: scale(0.97); background: rgba(255, 255, 255, 0.16); }
.btn svg { width: 18px; height: 18px; }
.btn.pri { background: linear-gradient(180deg, var(--wine) 0%, var(--wine-deep) 100%); border-color: rgba(255, 255, 255, 0.18); color: #fff; box-shadow: 0 1px 0 rgba(255, 255, 255, 0.2) inset, 0 8px 22px rgba(122, 21, 38, 0.4); }
.btn.quiet, .btn.ghost { background: transparent; border-color: var(--edge); color: var(--ink-2); }
.btn.ghost { color: var(--wine-hi); border-color: transparent; }
.btn.wide { width: 100%; }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: 14px; border-radius: 10px; }
.btn[disabled] { opacity: 0.45; pointer-events: none; }

  info: '<svg aria-hidden="true" viewBox="0 0 256 256" fill="currentColor"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm16-40a8,8,0,0,1-8,8,16,16,0,0,1-16-16V128a8,8,0,0,1,0-16,16,16,0,0,1,16,16v40A8,8,0,0,1,144,176ZM112,84a12,12,0,1,1,12,12A12,12,0,0,1,112,84Z"/></svg>',

<script>
/* ============================================================================
   Athletic Training — Sheet-Parser
   Wandelt das Trainings-Workbook in das App-Modell.
   Läuft in drei Umgebungen mit derselben Logik:
     - Node (Build, SheetJS aus xlsx)
     - Browser + Drive-Connector (SheetJS aus base64-xlsx)
     - Browser + Apps Script (rohe Zeilen-Arrays pro Tab)
   Eingang ist immer `sheets`: { [tabName]: Array<Array<cell>> }
   ========================================================================= */

(function (root) {
  'use strict';

  /* ---------- Zellen-Helfer ---------- */
  const S = (v) => {
    if (v == null) return '';
    if (v instanceof Date) return isoFromDate(v);
    return String(v).replace(/ /g, ' ').trim();
  };
  const N = (v) => {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    const t = String(v).trim();
    if (!t || t === '-' || t === '—' || t === '–') return null;
    const m = t.replace(/\s/g, '').replace(/\./g, (mm, off, str) => (/,/.test(str) ? '' : '.')).replace(',', '.');
    const cleaned = m.replace(/[^0-9.\-]/g, '');
    if (!cleaned || cleaned === '-' || cleaned === '.') return null;
    const n = parseFloat(cleaned);
    return isFinite(n) ? n : null;
  };
  const pad = (n) => String(n).padStart(2, '0');
  function isoFromDate(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  /** Datum aus 'TT.MM.JJJJ', Date, oder Excel-Serial. */
  function toISO(v) {
    if (v == null || v === '') return null;
    if (v instanceof Date) return isoFromDate(v);
    if (typeof v === 'number') {
      if (v < 1 || v > 60000) return null;
      const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000);
      return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
    }
    const s = String(v);
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[1] + '-' + m[2] + '-' + m[3];
    m = s.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
    if (m) return m[3] + '-' + pad(+m[2]) + '-' + pad(+m[1]);
    return null;
  }
  /** Sekunden aus 'hh:mm:ss', Date, oder Excel-Tagesbruchteil. */
  function toSeconds(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') {
      if (v <= 0) return null;
      return Math.round((v % 1) * 86400);
    }
    if (v instanceof Date) return v.getUTCHours() * 3600 + v.getUTCMinutes() * 60 + v.getUTCSeconds();
    const m = String(v).match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
    if (!m) return null;
    return (+m[1]) * 3600 + (+m[2]) * 60 + (+(m[3] || 0));
  }
  /** Wochen-Label normalisieren: 'W04\nE' und 'W04 / E' → 'W04'. */
  const weekKey = (v) => S(v).split(/[\n\r]|\s\/\s/)[0].trim();
  const isWeek = (v) => /^(B[12]|W\d{2}|G[1-5])$/.test(weekKey(v));

  /* ---------- Zeilen-Helfer ---------- */
  const rowEmpty = (r) => !r || r.every((c) => S(c) === '');
  const findRow = (rows, from, test) => {
    for (let i = from; i < rows.length; i++) if (test(rows[i], i)) return i;
    return -1;
  };
  const headingAt = (rows, text) =>
    findRow(rows, 0, (r) => S(r && r[0]).replace(/\s+/g, ' ').indexOf(text) === 0);

  /**
   * Tabelle nach einer Überschrift lesen.
   * Überspringt die Kopfzeile, liest bis zur ersten Zeile ohne Inhalt in Spalte A.
   */
  function tableAfter(rows, heading, opts) {
    const o = opts || {};
    const h = headingAt(rows, heading);
    if (h < 0) return [];
    let start = h + 1;
    if (o.skipHeader !== false) {
      // erste nicht-leere Zeile ist die Kopfzeile
      while (start < rows.length && rowEmpty(rows[start])) start++;
      start++;
    }
    const out = [];
    for (let i = start; i < rows.length; i++) {
      const r = rows[i] || [];
      if (S(r[0]) === '') break;
      if (o.stop && o.stop(r)) break;
      out.push(r.map(S));
    }
    return out;
  }

  /** Absätze nach einer Überschrift: Zeilen mit Inhalt nur in Spalte A. */
  function paragraphsAfter(rows, heading, limit) {
    const h = headingAt(rows, heading);
    if (h < 0) return [];
    const out = [];
    for (let i = h + 1; i < rows.length; i++) {
      const r = rows[i] || [];
      const a = S(r[0]);
      if (a === '') { if (out.length) break; else continue; }
      if (r.slice(1).some((c) => S(c) !== '')) break;
      out.push(a);
      if (limit && out.length >= limit) break;
    }
    return out;
  }

  /* ========================================================================
     Haupt-Parser
     ===================================================================== */
  function parseSheets(sheets) {
    const R = (name) => sheets[name] || [];

    /* ---------------- Übersicht ---------------- */
    const ov = R('Übersicht');
    const roadmap = tableAfter(ov, 'ROADMAP BIS RACE DAY').map((r) => ({
      block: r[0], zeitraum: r[1], fokus: r[2], kmWoche: r[3], longRun: r[4], prinzip: r[5],
    }));
    const ausgangslage = tableAfter(ov, 'AUSGANGSLAGE', { skipHeader: false }).map((r) => ({ label: r[0], text: r[1] }));
    const schritt0 = paragraphsAfter(ov, 'SCHRITT 0');
    const wochenstruktur = tableAfter(ov, 'WOCHENSTRUKTUR — 5 SLOTS').map((r) => ({
      tag: r[0], einheit: r[1], dauer: r[2], inhalt: r[3],
    }));
    const ziel = S(ov[1] && ov[1][0]);

    /* ---------------- Tagesprotokoll ---------------- */
    const tp = R('Tagesprotokoll');
    const tpHead = findRow(tp, 0, (r) => S(r && r[0]) === 'Datum');
    const days = [];
    for (let i = tpHead + 1; i < tp.length; i++) {
      const r = tp[i] || [];
      const iso = toISO(r[0]);
      if (!iso) { if (days.length) break; else continue; }
      const done = S(r[5]).toLowerCase();
      // erledigt: ja | nein | krank. Krank ist keine ausgelassene Einheit,
      // sondern eine, die ausfallen musste. Sie zählt nicht gegen die Umsetzung.
      days.push({
        row: i + 1, date: iso, tag: S(r[1]), week: weekKey(r[2]),
        sehnen: N(r[3]), gewicht: N(r[4]),
        done: done.indexOf('ja') === 0 ? true : done.indexOf('nein') === 0 ? false : done.indexOf('krank') === 0 ? 'sick' : null,
        plan: S(r[6]), notiz: S(r[7]),
      });
    }

    /* ---------------- Laufdaten ---------------- */
    const ld = R('Laufdaten');
    const ldHead = findRow(ld, 0, (r) => S(r && r[0]) === 'Datum');
    const runs = [];
    for (let i = ldHead + 1; i < ld.length; i++) {
      const r = ld[i] || [];
      const iso = toISO(r[0]);
      if (!iso) { if (runs.length) break; else continue; }
      const kmIst = N(r[4]);
      const sec = toSeconds(r[5]);
      const hf = N(r[7]);
      // Plausibilität: Laufpace zwischen 2:00 und 20:00 pro km. Alles andere
      // ist ein Eingabe- oder Formatfehler und wird als fehlend behandelt,
      // statt als „schnellste Pace 111:17" auf dem Bildschirm zu landen.
      let paceSec = kmIst && sec ? sec / kmIst : null;
      let timeSuspect = false;
      if (paceSec != null && (paceSec < 120 || paceSec > 1200)) { paceSec = null; timeSuspect = true; }
      runs.push({
        row: i + 1, date: iso, week: weekKey(r[1]), typ: S(r[2]),
        kmSoll: N(r[3]), kmIst, sec, hf, timeSuspect, rawZeit: r[5] == null ? null : String(r[5]),
        paceSec,
        mhb: paceSec && hf ? Math.round((kmIst * 1000) / ((sec / 60) * hf) * 100) / 100 : null,
        z2: N(r[8]), z3: N(r[9]), temp: N(r[10]), hm: N(r[11]),
        entkopplung: (S(r[13]) === '—' ? '' : S(r[13])),
        notiz: S(r[14]),
        done: kmIst != null,
      });
    }

    /* ---------------- Lauf: Wochenplan + Wochenwerte ---------------- */
    const lf = R('Lauf');
    const weeks = [];
    const wpHead = findRow(lf, 0, (r) => S(r && r[0]) === 'Woche' && S(r[1]) === 'Datum');
    for (let i = wpHead + 1; i < lf.length; i++) {
      const r = lf[i] || [];
      if (!isWeek(r[0])) { if (weeks.length) break; else continue; }
      const spikeRaw = r[6];
      weeks.push({
        row: i + 1, week: weekKey(r[0]), datum: S(r[1]), phase: S(r[2]),
        l1: N(r[3]), l2: N(r[4]), lr: N(r[5]),
        spike: typeof spikeRaw === 'number' ? spikeRaw : N(spikeRaw),
        spikeLabel: typeof spikeRaw === 'string' && N(spikeRaw) == null ? S(spikeRaw) : null,
        kmSoll: N(r[7]), zusatz: S(r[8]), kmIstSheet: N(r[9]),
        sehnenMax: N(r[10]), trend: N(r[11]), notiz: S(r[12]),
        entlastung: /ENTLASTUNG/i.test(S(r[2])),
      });
    }
    const weekly = [];
    const wvHead = findRow(lf, 0, (r) => S(r && r[0]) === 'Woche' && /Gewicht/.test(S(r[1])));
    for (let i = wvHead + 1; i < lf.length; i++) {
      const r = lf[i] || [];
      if (!isWeek(r[0])) { if (weekly.length) break; else continue; }
      weekly.push({
        row: i + 1, week: weekKey(r[0]), gewicht: N(r[1]),
        ruhepuls: N(r[2]), hrv: N(r[3]), schlaf: N(r[4]), bemerkung: S(r[5]),
      });
    }

    /* ---------------- Kraft ---------------- */
    const kr = R('Kraft');
    const kraft = { A: { title: '', columns: [], headerRow: 0, exercises: [] }, B: { title: '', columns: [], headerRow: 0, exercises: [] } };
    let blk = null, ex = null;
    for (let i = 0; i < kr.length; i++) {
      const r = kr[i] || [];
      const a = S(r[0]);
      if (/^KRAFT A/.test(a)) { blk = 'A'; kraft.A.title = a; ex = null; continue; }
      if (/^KRAFT B/.test(a)) { blk = 'B'; kraft.B.title = a; ex = null; continue; }
      if (!blk) continue;
      if (a === 'Übung') {
        kraft[blk].headerRow = i + 1;
        kraft[blk].columns = [];
        for (let c = 5; c < r.length; c++) {
          const lab = weekKey(r[c]);
          if (lab) kraft[blk].columns.push({ col: c + 1, week: lab, entlastung: /\bE\b/.test(S(r[c])) });
        }
        continue;
      }
      if (/^Notation/i.test(a)) { blk = null; ex = null; continue; }
      const satz = S(r[1]);
      if (!/^Satz/i.test(satz)) continue;
      if (a) {
        ex = { name: a, zielReps: S(r[2]), rir: S(r[3]), start: S(r[4]), sets: [] };
        kraft[blk].exercises.push(ex);
      }
      if (!ex) continue;
      const sessions = {};
      kraft[blk].columns.forEach((c) => {
        const raw = S(r[c.col - 1]);
        if (raw) sessions[c.week] = parseSet(raw);
      });
      ex.sets.push({ row: i + 1, satz, sessions });
    }

    /* ---------------- Sehnen ---------------- */
    const sh = R('Sehnen');
    const sehnenPhases = [];
    for (let i = 0; i < sh.length; i++) {
      const a = S(sh[i] && sh[i][0]);
      if (!/^(PHASE \d|ERSATZ-BLOCK)/.test(a)) continue;
      const items = [];
      for (let j = i + 2; j < sh.length; j++) {
        const r = sh[j] || [];
        if (S(r[0]) === '' || /^(PHASE \d|ERSATZ-BLOCK|WIE DU|SELBSTTESTS)/.test(S(r[0]))) break;
        items.push({ uebung: S(r[0]), dosis: S(r[1]), tempo: S(r[2]), ziel: S(r[3]), hinweis: S(r[4]) });
      }
      const t = a.split(/\s+[—·]\s+/);
      sehnenPhases.push({ key: t[0], title: a, hint: t.slice(1).join(', '), items });
    }
    const sehnenWann = tableAfter(sh, 'WANN MACHST DU WAS').map((r) => ({ wann: r[0], was: r[1], dauer: r.filter((x) => x)[2] || r[4] }));
    const sehnenTests = paragraphsAfter(sh, 'SELBSTTESTS');

    /* ---------------- Fueling ---------------- */
    const fu = R('Fueling');
    const fueling = {
      dayTypes: tableAfter(fu, 'TAGESZIELE NACH TAGESTYP').map((r) => ({ typ: r[0], gkg: r[1], g: r[2], protein: r[3], hinweis: r[4] })),
      progression: tableAfter(fu, 'FUELING-PROGRESSION').map((r) => ({ phase: r[0], dauer: r[1], waehrend: r[2], fluessig: r[3], ziel: r[4] })),
      sources: tableAfter(fu, 'Quelle', { skipHeader: false }).map((r) => ({ quelle: r[0], portion: r[1], carbs: r[2], ballast: r[3], praxis: r[4] })),
      raceDay: paragraphsAfter(fu, 'RENNTAG'),
    };

    /* ---------------- Gate ---------------- */
    const gt = R('Gate Dezember');
    const gate = {
      deadline: S(gt[1] && gt[1][0]),
      kriterien: [], anzahlJa: null, empfehlung: '',
      szenarien: tableAfter(gt, 'DIE RECHNUNG').map((r) => ({ szenario: r[0], zeit: r[1], steigerung: r[2], bewertung: r[3] })),
      einschaetzung: paragraphsAfter(gt, 'EHRLICHE EINSCHÄTZUNG'),
    };
    for (let i = 0; i < gt.length; i++) {
      const r = gt[i] || [];
      const a = S(r[0]);
      if (/^\d\.\s/.test(a) && S(r[1])) gate.kriterien.push({ row: i + 1, kriterium: a, messung: S(r[1]), status: S(r[2]), warum: S(r[3]) });
      if (a === 'Anzahl JA') gate.anzahlJa = N(r[2]) != null ? N(r[2]) : N(r[1]);
      if (a === 'Empfehlung') gate.empfehlung = S(r[1]);
    }

    /* ---------------- Quellen ---------------- */
    const qu = R('Quellen');
    const quellen = {
      sources: tableAfter(qu, 'PRIMÄRQUELLEN').map((r) => ({
        nr: N(r[0]), thema: r[1], quelle: r[2], jahr: r[3], link: r[4], folgt: r[5], belastbarkeit: r[6],
      })).filter((x) => x.thema),
      caveats: paragraphsAfter(qu, 'WO DIE EVIDENZ SCHWACH IST'),
    };

    /* ---------------- Legende ---------------- */
    const lg = R('Legende');
    const legende = {
      abbr: tableAfter(lg, 'ABKÜRZUNGEN', { skipHeader: false }).map((r) => ({ k: r[0], v: r[1] })),
      rules: tableAfter(lg, 'DIE SECHS REGELN', { skipHeader: false }).map((r) => ({ k: r[0], v: r[1] })),
    };

    /* ---------------- Roh-Notizen je Tab (Fallback für „mehr Info") -------- */
    const rawNotes = {};
    Object.keys(sheets).forEach((name) => {
      const rows = sheets[name] || [];
      const out = [];
      rows.forEach((r) => {
        const a = S(r && r[0]);

      self.history = self.history.slice(0, 30);

        return self.call(Object.assign({ op: item.op }, item.payload)).then(function (data) {

          LS.set('queue', self.queue);
          self.history.unshift({ logId: data.logId, op: item.op, label: item.label, ts: item.ts });
          LS.set('history', self.history);

    '" fill="none" stroke="var(--ink-2)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.75"/>';
  s += '<path d="' + line + '" fill="none" stroke="var(--wine)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  var lastPt = pts[pts.length - 1];
  s += '<circle cx="' + lastPt[0] + '" cy="' + lastPt[1] + '" r="6" fill="#2A0E16"/><circle cx="' + lastPt[0] + '" cy="' + lastPt[1] + '" r="4" fill="var(--wine)"/>';
  s += '<text x="' + f.x0 + '" y="' + (f.y1 + 15) + '">' + dShort(data[0].date) + '</text>' +
    '<text class="strong" x="' + f.x1 + '" y="' + (f.y1 + 15) + '" text-anchor="end">' + dShort(data[data.length - 1].date) + '</text>';
  s += '<line class="xh" x1="0" x2="0" y1="' + f.y0 + '" y2="' + f.y1 + '"/>';
  var slots = data.map(function (d, i) { return { x: pts[i][0], y: pts[i][1], d: { date: d.date, v: d.v, roll: roll[i].v } }; });
  slots.forEach(function (sl, i) {
    var l = i ? (slots[i - 1].x + sl.x) / 2 : f.x0, r = i < slots.length - 1 ? (slots[i + 1].x + sl.x) / 2 : f.x1;
    s += '<rect class="hit" x="' + l + '" y="' + f.y0 + '" width="' + Math.max(1, r - l) + '" height="' + f.ih + '"/>';
  });
  s += '</svg>';
  el.innerHTML = s;
  attachTip(el, el.querySelector('svg'), slots, function (d) {
    return '<div class="h">' + dLong(d.date) + '</div>' +
      '<div class="r"><span>Morgens</span><b>' + nf(d.v, 2) + ' kg</b></div>' +
      '<div class="r"><span>7-Tage-Schnitt</span><b>' + nf(d.roll, 2) + ' kg</b></div>';
  });
}

/* ---- Kilometer pro Woche ---- */
function chartWeeks(el, D, model) {
  var weeks = model.weeks;
  var f = frame(el, 170, { r: 28, b: 22 });
  var n = weeks.length, slot = f.iw / n, bw = Math.min(18, Math.max(5, slot - 5));
  var maxV = Math.max.apply(null, weeks.map(function (w) { return w.kmSoll || 0; }).concat(Object.keys(D.runs.kmByWeek).map(function (k) { return D.runs.kmByWeek[k]; })));
  var yMax = maxV * 1.14;
  var y = function (v) { return f.y1 - (v / yMax) * f.ih; };
  var s = '<svg width="' + f.w + '" height="' + f.h + '" viewBox="0 0 ' + f.w + ' ' + f.h + '" role="img" aria-label="Kilometer pro Woche, Ist gegen Soll">';
  s += '<g class="grid">';
  ticks(0, yMax, 3).forEach(function (v) {
    s += '<line x1="' + f.x0 + '" x2="' + f.x1 + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (f.x1 + 5) + '" y="' + (y(v) + 3.5) + '">' + nf0(v) + '</text>';
  });
  s += '</g>';
  var slots = [];
  weeks.forEach(function (w, i) {
    var cx = f.x0 + slot * i + slot / 2, ist = D.runs.kmByWeek[w.week] || 0;
    if (w.week === D.week) s += '<rect x="' + (cx - slot / 2) + '" y="' + (f.y0 - 4) + '" width="' + slot + '" height="' + (f.ih + 4) + '" rx="5" fill="var(--wine)" opacity="0.08"/>';
    if (ist > 0) s += '<path d="' + roundedBarPath(cx, bw, y(ist), f.y1) + '" fill="var(--wine)"/>';
    if (w.kmSoll) s += '<line x1="' + (cx - bw / 2 - 2) + '" x2="' + (cx + bw / 2 + 2) + '" y1="' + y(w.kmSoll) + '" y2="' + y(w.kmSoll) + '" stroke="' + (ist > 0 ? 'var(--ink)' : 'var(--ink-2)') + '" stroke-width="2" stroke-linecap="round"/>';
    if (w.entlastung) s += '<circle cx="' + cx + '" cy="' + (f.y1 + 5) + '" r="1.5" fill="var(--ink-3)"/>';
    slots.push({ x: cx, y: y(Math.max(ist, w.kmSoll || 0)), d: Object.assign({ ist: ist }, w) });
  });
  var curIdx = weeks.map(function (w) { return w.week; }).indexOf(D.week);
  var show = ['B1', 'W01', 'W04', 'W08', 'W12', 'G5'].filter(function (k) {
    var i = weeks.map(function (w) { return w.week; }).indexOf(k);
    return i >= 0 && Math.abs(i - curIdx) > 1;
  });
  show.push(D.week);
  weeks.forEach(function (w, i) {
    if (show.indexOf(w.week) < 0) return;
    s += '<text' + (w.week === D.week ? ' class="strong"' : '') + ' x="' + (f.x0 + slot * i + slot / 2) + '" y="' + (f.y1 + 17) + '" text-anchor="middle">' + esc(w.week) + '</text>';
  });
  s += '<line class="xh" x1="0" x2="0" y1="' + f.y0 + '" y2="' + f.y1 + '"/>';
  weeks.forEach(function (w, i) { s += '<rect class="hit" x="' + (f.x0 + slot * i) + '" y="' + f.y0 + '" width="' + slot + '" height="' + f.ih + '"/>'; });
  s += '</svg>';
  el.innerHTML = s;
  attachTip(el, el.querySelector('svg'), slots, function (w) {
    return '<div class="h">' + esc(w.week) + ' ' + esc(w.datum) + '</div>' +
      '<div class="r"><span>' + esc(w.phase) + '</span></div>' +
      '<div class="r"><span>Ist</span><b>' + (w.ist ? nf(w.ist) + ' km' : '–') + '</b></div>' +
      '<div class="r"><span>Soll</span><b>' + nf(w.kmSoll) + ' km</b></div>' +
      '<div class="r"><span>Long Run</span><b>' + nf(w.lr) + ' km</b></div>';
  });
}

/* ---- Long-Run-Progression ---- */
function chartLongRun(el, D, model) {
  var weeks = model.weeks;
  var f = frame(el, 160, { r: 28, b: 22 });
  var n = weeks.length, slot = f.iw / n;
  var yMax = Math.max.apply(null, weeks.map(function (w) { return w.lr || 0; })) * 1.15;
  var y = function (v) { return f.y1 - (v / yMax) * f.ih; };
  var s = '<svg width="' + f.w + '" height="' + f.h + '" viewBox="0 0 ' + f.w + ' ' + f.h + '" role="img" aria-label="Long Run pro Woche">';
  s += '<g class="grid">';
  ticks(0, yMax, 3).forEach(function (v) {
    s += '<line x1="' + f.x0 + '" x2="' + f.x1 + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (f.x1 + 5) + '" y="' + (y(v) + 3.5) + '">' + nf0(v) + '</text>';
  });
  s += '</g>';
  var pts = weeks.map(function (w, i) { return [f.x0 + slot * i + slot / 2, y(w.lr || 0)]; });
  var d = '';
  pts.forEach(function (p, i) { d += (i ? ' L' + (p[0] - slot / 2) + ',' + p[1] : 'M' + (p[0] - slot / 2) + ',' + p[1]) + ' L' + (p[0] + slot / 2) + ',' + p[1]; });
  s += '<path d="' + d + '" fill="none" stroke="var(--ink-3)" stroke-width="1.5" stroke-linejoin="round"/>';
  var slots = [];
  weeks.forEach(function (w, i) {
    var cx = pts[i][0], done = model.runs.filter(function (r) { return r.week === w.week && /LONG RUN/i.test(r.typ) && r.done; })[0];
    if (done) {
      s += '<circle cx="' + cx + '" cy="' + y(done.kmIst) + '" r="6" fill="#2A0E16"/>';
      s += '<circle cx="' + cx + '" cy="' + y(done.kmIst) + '" r="3.8" fill="var(--wine)"/>';
    }
    slots.push({ x: cx, y: y(w.lr || 0), d: Object.assign({ done: done }, w) });
  });
  s += '<text x="' + f.x0 + '" y="' + (f.y1 + 17) + '">B1</text><text class="strong" x="' + f.x1 + '" y="' + (f.y1 + 17) + '" text-anchor="end">G5</text>';
  s += '<line class="xh" x1="0" x2="0" y1="' + f.y0 + '" y2="' + f.y1 + '"/>';
  weeks.forEach(function (w, i) { s += '<rect class="hit" x="' + (f.x0 + slot * i) + '" y="' + f.y0 + '" width="' + slot + '" height="' + f.ih + '"/>'; });
  s += '</svg>';
  el.innerHTML = s;
  attachTip(el, el.querySelector('svg'), slots, function (w) {
    return '<div class="h">' + esc(w.week) + ' ' + esc(w.datum) + '</div>' +
      '<div class="r"><span>Geplant</span><b>' + nf(w.lr) + ' km</b></div>' +
      (w.done ? '<div class="r"><span>Gelaufen</span><b>' + nf(w.done.kmIst, 2) + ' km</b></div>' : '') +
      (w.spike != null ? '<div class="r"><span>Sprung</span><b>' + (w.spike > 0 ? '+' : '') + nf(w.spike * 100, 1) + ' %</b></div>' : '');
  });
}

/* ---- Meter pro Herzschlag ---- */
function chartMhb(el, D) {
  var data = D.runs.mhbSeries;
  if (data.length < 2) { el.innerHTML = '<p class="note dim">Ab zwei erfassten Läufen zeigt die App hier den Verlauf.</p>'; return; }
  var f = frame(el, 130, { r: 34, b: 20 });
  var vals = data.map(function (r) { return r.mhb; });
  var lo = Math.min.apply(null, vals) - 0.05, hi = Math.max.apply(null, vals) + 0.05;
  var n = data.length;
  var x = function (i) { return f.x0 + (n > 1 ? (i / (n - 1)) * f.iw : f.iw / 2); };
  var y = function (v) { return f.y1 - ((v - lo) / (hi - lo)) * f.ih; };
  var s = '<svg width="' + f.w + '" height="' + f.h + '" viewBox="0 0 ' + f.w + ' ' + f.h + '" role="img" aria-label="Meter pro Herzschlag je Lauf">';
  s += '<g class="grid">';
  ticks(lo, hi, 2).forEach(function (v) {
    s += '<line x1="' + f.x0 + '" x2="' + f.x1 + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (f.x1 + 5) + '" y="' + (y(v) + 3.5) + '">' + nf(v, 2) + '</text>';
  });
  s += '</g>';
  var pts = data.map(function (r, i) { return [x(i), y(r.mhb)]; });
  s += '<path d="' + pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + '" fill="none" stroke="var(--wine)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function (p, i) {
    var hot = data[i].z3 != null && data[i].z3 >= 10;
    s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="5.5" fill="#2A0E16"/>';
    s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.4" fill="' + (hot ? 'var(--warn)' : 'var(--wine)') + '"/>';
  });
  s += '<text x="' + f.x0 + '" y="' + (f.y1 + 15) + '">' + dShort(data[0].date) + '</text>' +
    '<text class="strong" x="' + f.x1 + '" y="' + (f.y1 + 15) + '" text-anchor="end">' + dShort(data[n - 1].date) + '</text>';
  s += '<line class="xh" x1="0" x2="0" y1="' + f.y0 + '" y2="' + f.y1 + '"/>';
  var slots = data.map(function (r, i) { return { x: pts[i][0], y: pts[i][1], d: r }; });
  slots.forEach(function (sl, i) {
    var l = i ? (slots[i - 1].x + sl.x) / 2 : f.x0, r2 = i < n - 1 ? (slots[i + 1].x + sl.x) / 2 : f.x1;
    s += '<rect class="hit" x="' + l + '" y="' + f.y0 + '" width="' + Math.max(1, r2 - l) + '" height="' + f.ih + '"/>';
  });
  s += '</svg>';
  el.innerHTML = s;
  attachTip(el, el.querySelector('svg'), slots, function (r) {
    return '<div class="h">' + dShort(r.date) + ' ' + esc(r.typ) + '</div>' +
      '<div class="r"><span>Meter pro Schlag</span><b>' + nf(r.mhb, 2) + '</b></div>' +
      '<div class="r"><span>Pace</span><b>' + pace(r.paceSec) + ' /km</b></div>' +
      '<div class="r"><span>Ø Herzfrequenz</span><b>' + nf0(r.hf) + '</b></div>' +
      (r.z3 != null ? '<div class="r"><span>Zone 3+</span><b>' + nf0(r.z3) + ' %</b></div>' : '') +
      (r.temp != null ? '<div class="r"><span>Temperatur</span><b>' + nf0(r.temp) + ' °C</b></div>' : '');
  });
}

/* ---- Zone 3+ pro Lauf ---- */
function chartZones(el, D) {
  var data = D.runs.done.filter(function (r) { return r.z3 != null; });
  if (!data.length) { el.innerHTML = '<p class="note dim">Noch keine Zonen-Anteile erfasst.</p>'; return; }
  var f = frame(el, 140, { r: 26, b: 20 });
  var n = data.length, slot = f.iw / n, bw = Math.min(22, Math.max(6, slot - 6));
  var yMax = Math.max(20, Math.max.apply(null, data.map(function (r) { return r.z3; })) * 1.15);
  var y = function (v) { return f.y1 - (v / yMax) * f.ih; };
  var s = '<svg width="' + f.w + '" height="' + f.h + '" viewBox="0 0 ' + f.w + ' ' + f.h + '" role="img" aria-label="Anteil Zone 3 und höher pro Lauf">';
  s += '<g class="grid">';
  ticks(0, yMax, 3).forEach(function (v) {
    s += '<line x1="' + f.x0 + '" x2="' + f.x1 + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (f.x1 + 5) + '" y="' + (y(v) + 3.5) + '">' + nf0(v) + '</text>';
  });
  s += '</g>';
  s += '<line x1="' + f.x0 + '" x2="' + f.x1 + '" y1="' + y(10) + '" y2="' + y(10) +
    '" stroke="var(--warn)" stroke-width="1.5" opacity="0.55" shape-rendering="crispEdges"/>';
  var slots = [];
  data.forEach(function (r, i) {
    var cx = f.x0 + slot * i + slot / 2;
    s += '<path d="' + roundedBarPath(cx, bw, y(r.z3), f.y1) + '" fill="' + (r.z3 >= 10 ? 'var(--warn)' : 'var(--wine)') + '"/>';
    slots.push({ x: cx, y: y(r.z3), d: r });
  });
  s += '<text x="' + f.x0 + '" y="' + (f.y1 + 15) + '">' + dShort(data[0].date) + '</text>' +
    '<text class="strong" x="' + f.x1 + '" y="' + (f.y1 + 15) + '" text-anchor="end">' + dShort(data[n - 1].date) + '</text>';
  s += '<line class="xh" x1="0" x2="0" y1="' + f.y0 + '" y2="' + f.y1 + '"/>';
  data.forEach(function (r, i) { s += '<rect class="hit" x="' + (f.x0 + slot * i) + '" y="' + f.y0 + '" width="' + slot + '" height="' + f.ih + '"/>'; });
  s += '</svg>';
  el.innerHTML = s;
  attachTip(el, el.querySelector('svg'), slots, function (r) {
    return '<div class="h">' + dShort(r.date) + ' ' + esc(r.typ) + '</div>' +
      '<div class="r"><span>Zone 3+</span><b>' + nf0(r.z3) + ' %</b></div>' +
      '<div class="r"><span>Zone 2</span><b>' + nf0(r.z2) + ' %</b></div>' +
      '<div class="r"><span>Dauer</span><b>' + dur(r.sec) + '</b></div>';
  });
}

/* ---- Sparkline für Kacheln ---- */
function sparkline(values, tone) {
  if (!values || values.length < 2) return '';
  var w = 100, h = 22, lo = Math.min.apply(null, values), hi = Math.max.apply(null, values);
  var span = (hi - lo) || 1;
  var pts = values.map(function (v, i) { return [(i / (values.length - 1)) * w, h - 2 - ((v - lo) / span) * (h - 5)]; });
  var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
  var col = tone === 'warn' ? 'var(--warn)' : 'var(--wine)';
  var last = pts[pts.length - 1];
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" width="100%" height="22" aria-hidden="true">' +
    '<path d="' + d + ' L' + w + ',' + h + ' L0,' + h + ' z" fill="' + col + '" opacity="0.13"/>' +
    '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
    '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="2" fill="' + col + '"/></svg>';
}

/* ---- Ring für den Sehnenwert ---- */
function tendonRing(value, max) {
  var m = max || 10, r = 38, c = 2 * Math.PI * r;
  var frac = value == null ? 0 : clamp(value / m, 0, 1);
  return '<svg viewBox="0 0 92 92" role="img" aria-label="Morgenwert ' + (value == null ? 'nicht eingetragen' : nfa(value, 1) + ' von ' + m) + '">' +
    '<circle cx="46" cy="46" r="' + r + '" fill="none" stroke="rgba(0,0,0,0.32)" stroke-width="10"/>' +
    '<circle cx="46" cy="46" r="' + r + '" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="10"/>' +
    '<circle cx="46" cy="46" r="' + r + '" fill="none" stroke="' + sevColor(value) + '" stroke-width="10" stroke-linecap="round" ' +
    'stroke-dasharray="' + c + '" stroke-dashoffset="' + (c * (1 - frac)) + '" transform="rotate(-90 46 46)"/>' +
    '<text x="46" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#fff" style="font-variant-numeric:tabular-nums;letter-spacing:-0.03em">' +
    (value == null ? '–' : nfa(value, 1)) + '</text>' +
    '<text x="46" y="65" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgba(255,255,255,0.5)">von ' + m + '</text></svg>';
}

/** Segmentbalken 0 bis 10, wie die Glukose-Anzeige der Referenz. */
function segScale(value) {
  var out = '<div class="segbar" role="img" aria-label="Skala 0 bis 10, Wert ' + (value == null ? 'fehlt' : nfa(value, 1)) + '">';
  for (var i = 0; i <= 10; i++) {
    var on = value != null && i <= Math.round(value);
    out += '<i class="' + (on ? 'on' : '') + '"' + (on ? ' style="background:' + sevColor(i) + '"' : '') + '></i>';
  }
  return out + '</div><div class="segbar-legend"><span>0 nichts</span><span>5 abbrechen</span><span>10</span></div>';
}

/* ---- Spike-Anzeige ---- */
function spikeGauge(el, D) {
  var sp = D.runs.nextSpike;
  var next = D.runs.nextRun;
  var pct = sp == null ? null : sp * 100;
  var w = 100;
  var pos = pct == null ? 0 : clamp((pct + 10) / 40, 0, 1) * 100;
  var tone = pct == null ? '' : (pct < 10 ? 'good' : 'warn');
  el.innerHTML =
    '<div class="dl"><div><dt>Längster Lauf der letzten 30 Tage</dt><dd>' + (D.runs.max30 ? nf(D.runs.max30, 2) + ' km' : '–') + '</dd></div>' +
    (next ? '<div><dt>Nächster Lauf, geplant</dt><dd>' + nf(next.kmSoll, 1) + ' km</dd></div>' : '') +
    '<div><dt>Sprung</dt><dd>' + (pct == null ? '–' : (pct > 0 ? '+' : '') + nf(pct, 1) + ' %') + '</dd></div></div>' +
    '<div class="pbar ' + tone + '" style="margin-top:14px"><i style="width:' + pos + '%"></i></div>' +
    '<div class="segbar-legend"><span>−10 %</span><span>0</span><span>+10 %</span><span>+30 %</span></div>' +
    (pct != null && pct >= 10
      ? '<div class="banner" style="margin-top:12px">' + IC.warn + '<div>Der nächste geplante Lauf liegt ' + nf(pct, 1) + ' Prozent über dem 30-Tage-Maximum. Das ist die Zone mit 64 Prozent höherem Risiko.</div></div>'
      : '');
}

</script>
<script>
/* ============================================================================
   Athletic Training — Ansichten, Detail-Blätter, Formulare, Menü
   ========================================================================= */
'use strict';

var TABS = [
  { id: 'heute', label: 'Heute', off: IC.today, on: IC.todayF },
  { id: 'woche', label: 'Woche', off: IC.week, on: IC.weekF },
  { id: 'laufe', label: 'Läufe', off: IC.run, on: IC.runF },
  { id: 'kraft', label: 'Kraft', off: IC.kraft, on: IC.kraftF },
  { id: 'plan', label: 'Plan', off: IC.gate, on: IC.gateF },
];
var App = { tab: 'heute', D: null, scrollTop: 0 };

/* ------------------------------------------------------------- Bausteine -- */
function sec(title, more, action) {
  return '<div class="sec"><h2>' + esc(title) + '</h2>' +
    (more ? '<button class="more" type="button" ' + action + '>' + esc(more) + IC.chev + '</button>' : '') + '</div>';
}
function card(inner, extra) { return '<section class="card' + (extra ? ' ' + extra : '') + '">' + inner + '</section>'; }
function tapCard(inner, attrs) { return '<button class="card tap" type="button" ' + attrs + '>' + inner + '</button>'; }
function cardTop(title, meta) {
  return '<div class="card-top"><h3>' + esc(title) + '</h3>' + (meta ? '<div class="meta">' + meta + '</div>' : '') + '</div>';
}
function stat(o) {
  return '<button class="stat" type="button" data-info="' + esc(o.info || '') + '">' +
    '<span class="head"><span class="lbl">' + esc(o.label) + '</span>' +
    (o.icon ? '<span class="chip-ic' + (o.tone ? ' ' + o.tone : '') + '">' + o.icon + '</span>' : '') + '</span>' +
    '<span class="val num">' + o.value + (o.unit ? '<u>' + esc(o.unit) + '</u>' : '') + '</span>' +
    (o.delta ? '<span class="foot">' + o.delta + '</span>' : '') +
    (o.mini ? '<span class="mini">' + o.mini + '</span>' : '') + '</button>';
}
function lrow(o) {
  var tag = o.attrs ? 'button' : 'div';
  return '<' + tag + ' class="lrow' + (o.avatar ? ' inset' : '') + '"' + (o.attrs ? ' type="button" ' + o.attrs : '') + '>' +
    (o.avatar ? '<span class="av' + (o.avTone ? ' ' + o.avTone : '') + '">' + o.avatar + '</span>' : '') +
    '<span class="txt"><span class="t">' + esc(o.title) + '</span>' + (o.sub ? '<span class="s">' + esc(o.sub) + '</span>' : '') + '</span>' +
    (o.value ? '<span class="end"><span class="v">' + o.value + '</span>' + (o.valueSub ? '<span class="s">' + esc(o.valueSub) + '</span>' : '') + '</span>' : '') +
    (o.attrs ? '<span class="chev">' + IC.chev + '</span>' : '') + '</' + tag + '>';
}
function deltaChip(v, unit, lowerIsBetter, digits) {
  if (v == null || isNaN(v)) return '';
  var flat = Math.abs(v) < 0.045, good = lowerIsBetter ? v < 0 : v > 0;
  return '<span class="delta ' + (flat ? '' : good ? 'good' : 'warn') + '">' + (flat ? '' : (v > 0 ? IC.up : IC.down)) +
    (flat ? '±0' : nf(Math.abs(v), digits == null ? 1 : digits)) + ' ' + esc(unit) + '</span>';
}
function pbar(pct, tone) { return '<div class="pbar' + (tone ? ' ' + tone : '') + '"><i style="width:' + clamp(pct, 0, 100) + '%"></i></div>'; }
function hint(text, tone, icon) { return '<div class="hint-row' + (tone ? ' ' + tone : '') + '">' + (icon || IC.info) + '<div>' + text + '</div></div>'; }
function sessionIcon(key) {
  if (key === 'lr' || key === 'run1' || key === 'run2') return IC.run;
  if (key === 'race' || key === 'test') return IC.flag;
  if (key === 'kraftA' || key === 'kraftB' || key === 'kraftO') return IC.kraft;
  if (key === 'off' || key === 'buffer') return IC.moon;
  return IC.today;
}

/* Wiedereinstieg nach Krankheit: Vorschlag der App, angelehnt an die Stopp-Regeln des Plans */
function reentryAdvice(S) {
  var n = S.active ? S.streak : S.episode;
  if (!n) return null;
  if (n <= 2) return { level: 0, title: 'Weiter im Plan', text: 'Ein bis zwei Tage Pause kosten nichts. Nächste Einheit wie geplant, aber easy, und den Morgenwert danach anschauen.' };
  if (n <= 5) return { level: 1, title: 'Diese Woche wiederholen', text: 'Nach ' + n + ' Tagen Pause nicht steigern. Die laufende Woche noch einmal, mit denselben Kilometern. Das ist die Regel für „nicht steigern" aus dem Plan.' };
  return { level: 2, title: 'Eine Woche zurück', text: 'Nach ' + n + ' Tagen Pause eine Woche zurück im Plan und den Sehnen-Block eine Phase zurück, in zwei Wochen wieder aufbauen. So sieht es der Plan auch nach einer Reisepause vor.' };
}

var kraftBlock = 'A';
function viewKraft(D, m) {
  var K = m.kraft[kraftBlock], cols = K.columns.map(function (c) { return c.week; }), targetWeek = D.week, done = 0;
  K.exercises.forEach(function (ex) { if (exSummary(ex, cols, targetWeek).current) done++; });
  var h = '';
  h += '<section class="hero">' +
    '<div class="lead">' + (kraftBlock === 'A' ? 'Kraft A, Ganzkörper schwer' : 'Kraft B, Volumen und Core') + '</div>' +

    (D.weekPlan && D.weekPlan.entlastung ? '<span class="pill2 q">' + IC.warn + 'ein Satz weniger, 80 Prozent</span>' : '<span class="pill2 q">Double Progression</span>') + '</div>' +
    '<div class="acts two">' +
    '<button class="act" type="button" data-info="kraftlogik">' + IC.book + '<span>Warum Kraft</span></button>' +
    '<button class="act" type="button" data-info="sehnenblock">' + IC.heart + '<span>Sehnen-Block</span></button></div></section>';

  h += '<div class="sec"><h2>Übungen</h2><div class="seg" role="tablist">' +
    '<button role="tab" type="button" aria-selected="' + (kraftBlock === 'A') + '" data-kblock="A">Kraft A</button>' +
    '<button role="tab" type="button" aria-selected="' + (kraftBlock === 'B') + '" data-kblock="B">Kraft B</button></div></div>';

  h += card('<div class="list">' + K.exercises.map(function (ex, i) {
    var s = exSummary(ex, cols, targetWeek);
    return lrow({ avatar: s.current ? IC.check : IC.kraft, avTone: s.current ? 'wine' : '', title: ex.name,
      sub: 'Ziel ' + ex.zielReps + ' Wdh, RIR ' + ex.rir + (s.lastWeek ? ', ' + s.lastWeek + ': ' + s.lastLabel : ''),
      value: s.current ? esc(s.currentWeight || 'BW') : (s.lastWeight ? '<span style="color:var(--ink-3)">' + esc(s.lastWeight) + '</span>' : ''),
      valueSub: s.current ? targetWeek : (s.lastWeight ? targetWeek + ' offen' : 'offen'),
      attrs: 'data-form="strength" data-block="' + kraftBlock + '" data-ex="' + i + '" data-week="' + esc(targetWeek) + '"' });
  }).join('') + '</div>');

  var phase = m.sehnen.phases.filter(function (p) { return p.key === D.phaseKey; })[0] || m.sehnen.phases[0];
  h += sec('Sehnen-Block', 'Alle Phasen', 'data-info="sehnenblock"');
  h += tapCard(cardTop(phase ? phase.key + ', ' + phase.hint : 'Sehnen-Block', 'dreimal pro Woche') +
    '<div class="list">' + (phase ? phase.items : []).map(function (it) { return lrow({ title: it.uebung, sub: it.ziel, value: esc(it.dosis), valueSub: it.tempo }); }).join('') + '</div>', 'data-info="sehnenblock"');
  return h;

function exSummary(ex, cols, targetWeek) {
  var filled = cols.filter(function (w) { return ex.sets.some(function (s) { return s.sessions[w]; }); });
  var current = filled.indexOf(targetWeek) >= 0 ? targetWeek : null;
  var prior = filled.filter(function (w) { return w !== targetWeek && cols.indexOf(w) < cols.indexOf(targetWeek); });
  var lastWeek = prior.length ? prior[prior.length - 1] : (filled.length ? filled[filled.length - 1] : null);
  function pick(w) { return w ? ex.sets.map(function (s) { return s.sessions[w]; }).filter(Boolean) : []; }
  var cur = pick(current), lst = pick(lastWeek);
  function weightOf(arr) {
    var ws = arr.map(function (q) { return q.weight; }).filter(Boolean);
    return ws.length ? ws.filter(function (v, i, s) { return s.indexOf(v) === i; }).join(' / ') : (arr.length ? 'BW' : '');
  }
  return { current: cur.length ? cur : null, currentWeight: weightOf(cur), lastWeek: lastWeek, lastWeight: weightOf(lst),

/* ========================================================================== */
/*  Detail-Blatt: erst das Wesentliche, der Rest aufklappbar                  */
/* ========================================================================== */
function openInfo(key) {
  if (!INFO || !INFO[key]) {
    Store.ensureContent().then(function () {
      if (INFO[key]) openInfo(key); else Toast.show({ title: 'Text nicht gefunden', text: 'Für diesen Punkt liegt kein Eintrag vor.', tone: 'err' });
    }, function (err) { Toast.show({ title: 'Erklärtexte fehlen noch', text: (err && err.message) || '', tone: 'err' }); });
    return;
  }
  var info = INFO[key], D = App.D, m = Store.model;
  var lead = '', rest = '', proseSeen = 0;
  function blockHtml(b) {
    if (b.t === 'prose') return '<p class="prose">' + escRich(b.text) + '</p>';
    if (b.t === 'quote') return '<p class="lede' + (b.tone === 'warn' ? ' warn' : '') + '">' + escRich(b.text) + '</p>';
    if (b.t === 'eyebrow') return '<div class="eyebrow">' + esc(b.text) + '</div>';
    if (b.t === 'bullets') return '<ul class="bul' + (b.num ? ' num' : '') + '">' + b.items.map(function (x) { return '<li>' + escRich(x) + '</li>'; }).join('') + '</ul>';
    if (b.t === 'rules') return '<div class="dl stack">' + b.items.map(function (r) { return '<div><dt>' + esc(r.k) + '</dt><dd>' + esc(r.v) + '</dd></div>'; }).join('') + '</div>';
    if (b.t === 'live') return '<div data-live="' + esc(b.kind) + '"></div>';
    return '';
  }
  // Vorne bleibt: Live-Bausteine, die erste Kernaussage, Regeln. Alles weitere
  // steht hinter „Mehr lesen", damit man es lesen kann, aber nicht muss.
  info.blocks.forEach(function (b) {
    var isCore = b.t === 'live' || b.t === 'rules' || (b.t === 'quote' && proseSeen === 0);
    if (b.t === 'prose' || b.t === 'quote') proseSeen++;
    if (isCore || proseSeen <= 1) lead += blockHtml(b); else rest += blockHtml(b);
  });
  var html = lead + (rest ? '<details class="disc"><summary>Mehr lesen' + IC.chev + '</summary><div class="body">' + rest + '</div></details>' : '');
  var srcs = renderSources(info.sources, m);
  if (srcs) html += '<details class="disc"><summary>Belege' + IC.chev + '</summary><div class="body">' + srcs + '</div></details>';

  Sheet.show({ title: info.title, sub: info.sub, html: html, onMount: function (body) {
    $$('[data-live]', body).forEach(function (host) {

function submit(op, payload, label, btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Speichert …'; }
  Store.write(op, payload, label).then(function (data) {
    Sheet.close(); render();
    Toast.show({ title: 'Eingetragen', text: label + ' steht in der Tabelle.',
      action: data && data.logId ? { label: 'Rückgängig', icon: IC.undo, run: function () { return Store.undo(data.logId).then(function () { render(); Toast.show({ title: 'Rückgängig gemacht', text: label + ' ist wieder wie vorher.' }); }); } } : null });
  }).catch(function (err) {
    if (btn) { btn.disabled = false; btn.textContent = 'Speichern'; }
    if (err && err.code === 'queued') { Sheet.close(); render(); Toast.show({ title: 'Gemerkt', text: err.message }); return; }
    Toast.show({ title: 'Speichern ging nicht', text: (err && err.message) || 'Unbekannter Fehler.', tone: 'err' });
  });
}

          .catch(function (err) {

  var html = Store.history.length
    ? '<div class="list">' + Store.history.map(function (h) { return '<div class="lrow"><span class="txt"><span class="t">' + esc(h.label || h.op) + '</span><span class="s">' + esc(relTime(h.ts)) + '</span></span><button class="btn sm quiet" type="button" data-undo="' + esc(h.logId) + '">' + IC.undo + 'Rückgängig</button></div>'; }).join('') + '</div>'
    : '<div class="empty">' + IC.clock + '<div>Noch keine Einträge über die App.</div></div>';
  Sheet.show({ title: 'Verlauf', sub: 'Jeder Eintrag einzeln rückgängig', html: html, onMount: function (body) {
    $$('[data-undo]', body).forEach(function (b) {
      b.addEventListener('click', function () {
        b.disabled = true; b.textContent = 'Macht …';
        Store.undo(b.getAttribute('data-undo')).then(function () { Sheet.close(); render(); Toast.show({ title: 'Rückgängig gemacht' }); })
          .catch(function (err) { b.disabled = false; Toast.show({ title: 'Ging nicht', text: (err && err.message) || '', tone: 'err' }); });
      });
    });
  } });
}

/** Rohdaten für die Fehlersuche: Metadaten und die ersten Läufe, so wie das Script sie liefert. */
function openDiagnose() {
  var m = Store.model, meta = Store.meta || {};
  var runs = m.runs.filter(function (r) { return r.kmIst != null; }).slice(0, 12);
  var html = '<div class="dl">' +
    '<div><dt>Script-Version</dt><dd>' + esc(meta.version || '–') + '</dd></div>' +
    '<div><dt>Erklärtexte</dt><dd>' + esc(meta.contentVersion || 'fehlen') + '</dd></div>' +
    '<div><dt>Geladen</dt><dd>' + esc(stamp(meta.fetchedAt) || '–') + '</dd></div>' +
    '<div><dt>Zeitzone der Tabelle</dt><dd>' + esc(meta.timeZone || '–') + '</dd></div>' +
    '<div><dt>Tage, Läufe</dt><dd>' + m.days.length + ', ' + m.runs.length + '</dd></div></div>' +
    '<div class="eyebrow">Läufe, wie geliefert</div>' +
    '<div class="tw"><table><thead><tr><th>Datum</th><th>km</th><th>Zeit roh</th><th>Sekunden</th><th>Pace</th></tr></thead><tbody>' +
    runs.map(function (r) { return '<tr' + (r.timeSuspect ? ' style="color:var(--warn)"' : '') + '><td>' + dShort(r.date) + '</td><td>' + nf(r.kmIst, 2) + '</td><td class="txt">' + esc(r.rawZeit == null ? '–' : r.rawZeit) + '</td><td>' + (r.sec == null ? '–' : r.sec) + '</td><td>' + (r.paceSec ? pace(r.paceSec) : (r.timeSuspect ? 'unplausibel' : '–')) + '</td></tr>'; }).join('') +
    '</tbody></table></div>' +
    '<span class="hint">Gelb markierte Zeilen ergeben keine plausible Pace. Der Wert in „Zeit roh" zeigt, was in der Tabelle steht.</span>';
  Sheet.show({ title: 'Diagnose', sub: 'Was die App vom Script bekommt', html: html });
}

/* ========================================================================== */
/*  Rendern                                                                   */
/* ========================================================================== */
function viewWelcome() {
  return '<section class="hero"><div class="lead">Vienna City Marathon, 18. April 2027</div>' +
    '<div class="big" style="font-size:32px;letter-spacing:-0.03em">Die Daten bleiben in deiner Tabelle</div>' +
    '<div class="pills"><span class="pill2 q">Sub-4h heißt 5:41 pro km</span></div>' +
    '<button class="btn wide" style="margin-top:16px;background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.28)" type="button" data-act="setup">' + IC.plus + 'Mit der Tabelle verbinden</button></section>' +
    sec('Nach dem Verbinden') +
    card('<ul class="bul"><li>Morgenwert, Gewicht und Status in zehn Sekunden, mit Rückgängig.</li><li>Lauf erfassen, Pace und Meter pro Herzschlag rechnet die App.</li><li>Kraft-Sätze in der Notation deines Sheets.</li><li>Jede Kachel öffnet Regel und Beleg dazu.</li><li>Offline gemerkt, später nachgeschickt.</li></ul>');
}

function render() {
  closeMenu();
  var m = Store.model;
  if (!m) {
    $('#navTitle').textContent = 'Athletic Training'; $('#navSub').textContent = 'Noch nicht verbunden';
    $('#view').innerHTML = viewWelcome(); $('#tabbar').parentNode.hidden = true; return;
  }
  $('#tabbar').parentNode.hidden = false;
  App.D = derive(m);
  var D = App.D;
  var titles = {
    heute: ['Athletic Training', 'Vienna City Marathon, 18. April 2027'],
    woche: ['Woche ' + D.week, D.weekPlan ? D.weekPlan.phase + ', ' + D.weekPlan.datum : ''],
    laufe: ['Läufe', D.runs.done.length + ' erfasst, ' + nf(D.runs.totalKm) + ' km'],
    kraft: ['Kraft', 'Woche ' + D.week],
    plan: ['Plan', 'Gate am 31. Dezember'],
  }[App.tab];
  $('#navTitle').textContent = titles[0]; $('#navSub').textContent = titles[1];
  $('#refreshBtn').dataset.state = Store.status.state || 'snap';

  var html = App.tab === 'heute' ? viewHeute(D, m) : App.tab === 'woche' ? viewWoche(D, m) : App.tab === 'laufe' ? viewLaufe(D, m) : App.tab === 'kraft' ? viewKraft(D, m) : viewPlan(D, m);
  if (Store.queue.length) html = '<div class="pendingbar">' + IC.clock + Store.queue.length + ' ' + (Store.queue.length === 1 ? 'Eintrag wartet' : 'Einträge warten') + ' auf Versand</div>' + html;
  var view = $('#view'); view.innerHTML = html;
  view.style.animation = 'none'; void view.offsetHeight; view.style.animation = '';

  $$('.tab').forEach(function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-tabid') === App.tab)); });
  if ($('#chWeeks')) chartWeeks($('#chWeeks'), D, m);
  if ($('#chWeeks2')) chartWeeks($('#chWeeks2'), D, m);
  if ($('#chMhb')) chartMhb($('#chMhb'), D);
  if ($('#chZones')) chartZones($('#chZones'), D);
  $('#scroll').scrollTop = App.scrollTop || 0;
}

function setTab(id) {
  if (App.tab === id) { $('#scroll').scrollTo({ top: 0, behavior: 'smooth' }); App.scrollTop = 0; return; }
  App.tab = id; App.scrollTop = 0; LS.set('tab', id); render();
}

function bindGlobal() {
  $$('.tab').forEach(function (t) { t.addEventListener('click', function () { setTab(t.getAttribute('data-tabid')); }); });
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-info],[data-form],[data-tab],[data-act],[data-kblock],[data-close]') : null;
    if (!t) return;
    if (t.hasAttribute('data-close')) { Sheet.close(); return; }
    if (t.hasAttribute('data-kblock')) { kraftBlock = t.getAttribute('data-kblock'); App.scrollTop = $('#scroll').scrollTop; render(); return; }
    if (t.hasAttribute('data-tab')) { setTab(t.getAttribute('data-tab')); return; }
    if (t.hasAttribute('data-act')) {
      var a = t.getAttribute('data-act');
      if (a === 'setup') openSetup(); else if (a === 'history') openHistory(); else if (a === 'menu') openMenu($('#setupBtn')); else if (a === 'diagnose') openDiagnose();
      return;
    }
    if (t.hasAttribute('data-info')) { var key = t.getAttribute('data-info'); if (key) openInfo(key); return; }
    if (t.hasAttribute('data-form')) {
      var fo = t.getAttribute('data-form');
      if (fo === 'daily') formDaily(t.getAttribute('data-date'));
      else if (fo === 'run') formRun(t.getAttribute('data-date'));
      else if (fo === 'strength') formStrength(t.getAttribute('data-block'), parseInt(t.getAttribute('data-ex'), 10), t.getAttribute('data-week'));
      else if (fo === 'weekly') formWeekly(t.getAttribute('data-week'));
      else if (fo === 'gate') formGate(parseInt(t.getAttribute('data-index'), 10));
    }
  });
  var scroll = $('#scroll'), app = $('#app'), ticking = false;
  scroll.addEventListener('scroll', function () {
    App.scrollTop = scroll.scrollTop;
    if (ticking) return; ticking = true;
    requestAnimationFrame(function () { app.classList.toggle('scrolled', scroll.scrollTop > 10); ticking = false; });
  }, { passive: true });
  $('#refreshBtn').addEventListener('click', function () {
    if (!NET) { openPreviewNote(); return; }
    var b = $('#refreshBtn'); b.classList.add('spin');
    Store.refresh().then(function () { render(); }, function (err) { Toast.show({ title: 'Laden ging nicht', text: (err && err.message) || '', tone: 'err' }); }).then(function () { b.classList.remove('spin'); });
  });
  $('#setupBtn').addEventListener('click', function () { openMenu($('#setupBtn')); });
  window.addEventListener('online', function () { Store.flush().then(function (n) { if (n) { render(); Toast.show({ title: 'Nachgeschickt', text: n + ' Eintrag' + (n > 1 ? 'e' : '') + ' ist jetzt in der Tabelle.' }); } }); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    Store.flush();
    if (Store.canWrite() && Store.meta && Store.meta.fetchedAt && Date.now() - new Date(Store.meta.fetchedAt).getTime() > 120000) Store.refresh({ quiet: true }).then(function () { render(); }, function () {});
  });
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(render, 150); });
}

function boot(snapshot) {
  Store.init(snapshot);
  Store.history = LS.get('history', []);
  App.tab = LS.get('tab', 'heute');
  if (['heute', 'woche', 'laufe', 'kraft', 'plan'].indexOf(App.tab) < 0) App.tab = 'heute';
  Sheet.mount(); Toast.mount();
  $('#tabbar').innerHTML = TABS.map(function (t) {
    return '<button class="tab" type="button" role="tab" data-tabid="' + t.id + '" aria-label="' + esc(t.label) + '" aria-selected="' + (t.id === App.tab) + '">' +
      '<span class="off">' + t.off + '</span><span class="on">' + t.on + '</span></button>';
  }).join('');
  Store.on(function () { var b = $('#refreshBtn'); if (b) b.dataset.state = Store.status.state || 'snap'; });
  bindGlobal();
  Store.setStatus(Store.canWrite() ? 'busy' : 'snap', '');
  render();
  if (Store.canWrite()) {
    Store.flush().then(function () { return Store.refresh({ quiet: true }); }).then(function () { render(); }, function (err) {
      render();
      if (err && err.code === 'bad_key') Toast.show({ title: 'Zugangscode passt nicht', text: 'Im Menü unter Verbindung neu eintragen.', tone: 'err' });
    });
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:' && window.W27_PWA) navigator.serviceWorker.register('sw.js').catch(function () {});
}
